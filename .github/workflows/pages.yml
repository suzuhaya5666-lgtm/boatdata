name: pages

# 集計データは保存せず、公開のたびに作って一緒に載せる(履歴がふくらまないように)
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [collect]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 成績の集計
        run: |
          pip install --quiet numpy
          python scripts/stats.py

      - name: 公開するファイルをまとめる
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/index.json _site/data/
          cp -r data/races data/stats data/model data/notes _site/data/
          [ -d data/before ] && cp -r data/before _site/data/ || true
          [ -d data/odds ] && cp -r data/odds _site/data/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
