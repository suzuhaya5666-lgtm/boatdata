name: fanprobe

# 選手のファン手帳データ(性別入り)を取れるか試す
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -q lhasa >/dev/null 2>&1 || true
          for n in 2610 2604 2510; do
            u="https://www.boatrace.jp/static_extra/pc_static/download/data/kibetsu/fan$n.lzh"
            code=$(curl -sS -A "Mozilla/5.0" -o fan$n.lzh -w "%{http_code}" "$u"); echo "$n $code $(stat -c %s fan$n.lzh)"
            if [ "$code" = "200" ]; then lha -xq fan$n.lzh && ls -la; f=$(ls fan*.txt 2>/dev/null | head -1); echo "file $f"; iconv -f cp932 -t utf-8 "$f" | head -3 | cut -c1-200; break; fi
          done
