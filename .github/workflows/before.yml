name: before

# 直前情報: レース開催中(8:00〜22:00 日本時間)は10分ごとに、締切が近いレースだけ取りに行く
on:
  schedule:
    - cron: "*/10 23,0-12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: before
  cancel-in-progress: false

jobs:
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 直前情報の取得
        run: python scripts/before.py

      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/before 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "直前情報 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
