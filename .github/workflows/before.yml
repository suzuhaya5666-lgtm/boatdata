name: before

# 直前情報: 1日3回起動し、それぞれ最大5時間半、5分ごとに締切が近いレースの直前情報を取る。
# (10分ごとの定期実行は GitHub 側で飛ばされることが多かったため、この形にしている)
on:
  schedule:
    - cron: "47 22 * * *"   # 7:47(日本時間)
    - cron: "17 4 * * *"    # 13:17
    - cron: "47 9 * * *"    # 18:47
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: before
  cancel-in-progress: false

jobs:
  before:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 直前情報の取得(5分ごと)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u scripts/before.py --loop 330
