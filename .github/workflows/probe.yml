name: probe
# 調査用: 指定したページの中身をログに出す(データは保存しない)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "調べるURL"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "Mozilla/5.0" "Mozilla/5.0 (personal data collection)" "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"; do
            curl -sS -4 -A "$ua" "${{ inputs.url }}" -o page.html -w "UA[$ua] status %{http_code} size %{size_download} connect %{time_connect}s firstbyte %{time_starttransfer}s total %{time_total}s\n"
          done
          curl -sS -4 -A "Mozilla/5.0" "https://www.boatrace.jp/owpc/pc/race/beforeinfo?rno=1&jcd=11&hd=20261109" -o /dev/null -w "beforeinfo total %{time_total}s\n"
          curl -sS -4 -A "Mozilla/5.0" "https://www.boatrace.jp/owpc/pc/race/raceresult?rno=1&jcd=11&hd=20261109" -o /dev/null -w "raceresult total %{time_total}s\n"
          python3 - <<'PY'
          import re
          h=open("page.html",encoding="utf-8",errors="replace").read()
          body=re.sub(r"\s+"," ",h)
          s=body.find("<main"); s = s if s >= 0 else 0
          print(body[s:s+60000])
          PY
