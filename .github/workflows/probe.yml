name: probe
on:
  workflow_dispatch:
    inputs:
      url:
        description: "調べるURL"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -A "Mozilla/5.0" "${{ inputs.url }}" -o page.html -w "status %{http_code} size %{size_download}\n"
          python3 - <<'PY'
          import re
          h=open("page.html",encoding="utf-8",errors="replace").read()
          i=h.find("is-w748")
          body=re.sub(r"\s+"," ",h)
          s=body.find("<main"); print(body[s:s+30000] if s>=0 else body[:30000])
          PY
