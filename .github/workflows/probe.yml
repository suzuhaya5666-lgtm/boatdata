name: probe
# 調査用: 指定したページの中身をログに出す(データは保存しない)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "調べるURL"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -A "Mozilla/5.0" "${{ inputs.url }}" -o page.html -w "status %{http_code} size %{size_download}\n"
          python3 - <<'PY'
          import re
          h=open("page.html",encoding="utf-8",errors="replace").read()
          body=re.sub(r"\s+"," ",h)
          s=body.find("<main"); s = s if s >= 0 else 0
          print(body[s:s+60000])
          PY
