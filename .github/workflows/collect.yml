name: collect

on:
  schedule:
    # GitHub の定期実行は混むと遅れたり飛ばされたりするので、ずらした時刻で4回(どれか1回動けば足りる)
    - cron: "13 23 * * *"   # 8:13(日本時間) 今日の出走表・前日の結果
    - cron: "43 2 * * *"    # 11:43 出走表の取り直し
    - cron: "37 14 * * *"   # 23:37 今日の結果(ナイター含む)
    - cron: "7 16 * * *"    # 1:07 今日の結果の取り直し
  workflow_dispatch:
    inputs:
      start:
        description: "開始日 YYYYMMDD(空なら直近3日)"
        required: false
        default: ""
      end:
        description: "終了日 YYYYMMDD(空なら今日)"
        required: false
        default: ""
      reparse:
        description: "保存済みの元データから解析だけやり直す"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 解凍ソフトの準備
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          sudo apt-get install -y lhasa || true

      - name: グレード(月間スケジュール)
        run: python scripts/grades.py

      - name: データ収集
        run: |
          python scripts/collect.py --start "${{ inputs.start }}" --end "${{ inputs.end }}" ${{ inputs.reparse && '--reparse' || '' }}

      - name: 出目確率の重み(月1回)
        run: |
          pip install --quiet numpy scipy
          python scripts/model.py

      - name: 保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "データ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
