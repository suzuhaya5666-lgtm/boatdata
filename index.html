<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ボートデータ">
<title>ボートレース データ</title>
<style>
  :root {
    --bg: #f3f5f9; --card: #fff; --ink: #1d2733; --sub: #6b7684; --line: #e3e7ed;
    --accent: #1565c0; --hit: #d9480f; --cell-off: #eceff4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px;
    padding-bottom: calc(64px + env(safe-area-inset-bottom)); -webkit-text-size-adjust: 100%; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; color: var(--ink); cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .35; }
  main { padding: 12px; max-width: 900px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .meta { color: var(--sub); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  .note { color: var(--sub); font-size: 12px; margin-top: 6px; }

  /* ---- 上部バー */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
  .bar .in { max-width: 900px; margin: 0 auto; }
  .datenav { display: flex; align-items: center; gap: 10px; }
  .datenav .pill { border-radius: 999px; padding: 8px 16px; color: var(--sub); white-space: nowrap; }
  .datenav .label { flex: 1; text-align: center; font-weight: 800; font-size: 18px; position: relative; white-space: nowrap; }
  @media (max-width: 520px) {
    .datenav { gap: 6px; }
    .datenav .pill { padding: 7px 10px; font-size: 14px; }
    .datenav .label { font-size: 16px; }
    .datenav .label .wide { display: none; }
  }
  .datenav .label input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .datenav .label .cal { font-size: 15px; margin-left: 4px; }
  .back { border: 0; background: none; color: var(--accent); padding: 4px 0; font-weight: 600; }
  .bar h1 { font-size: 20px; margin: 4px 0 0; }
  .bar .sub { color: var(--sub); font-size: 13px; margin-top: 2px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; }
  .chips button { min-width: 46px; padding: 6px 0; }
  .updated { color: var(--sub); font-size: 12px; text-align: right; margin-top: 6px; }

  /* ---- 場選択 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--line); gap: 1px; }
  .cell { background: var(--card); min-height: 132px; padding: 14px 8px; text-align: center; border: 0; border-radius: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .cell .vn { font-size: 24px; font-weight: 800; letter-spacing: .05em; }
  .cell .dl { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .cell .st { font-size: 17px; font-weight: 800; }
  .cell .st.done { color: #9aa3ae; font-weight: 700; }
  .cell .tt { font-size: 11px; color: var(--sub); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell.off { background: var(--cell-off); cursor: default; }
  .cell.off .vn { color: #b0b8c3; }
  .cell { position: relative; }
  .gbr { position: absolute; top: 0; left: 0; display: flex; align-items: center; gap: 4px; }
  .gb { display: inline-block; font-size: 13px; font-weight: 800; padding: 3px 8px; color: #fff; border-radius: 0 0 6px 0; }
  .bar h1 .gb { border-radius: 4px; vertical-align: middle; font-size: 13px; }
  .gip { background: #8c9bb5; } .gg3 { background: #4dabf7; } .gg2 { background: #20c997; }
  .gg1 { background: #f59f00; } .gsg { background: #c92a2a; }
  .gt { font-size: 15px; }
  .night { display: inline-block; background: #d0bfff; color: #3b2a8a; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #e9ecef; color: #6b7684; }
  .tag.final { background: #ffe8cc; color: #d9480f; }

  /* ---- 出走表一覧 */
  .race { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .race .head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .race .no { font-size: 24px; font-weight: 800; min-width: 2.2em; }
  .race .dead { font-size: 15px; color: var(--sub); }
  .race .dead b { font-size: 20px; color: var(--ink); margin-left: 4px; }
  .race .badge { margin-left: auto; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; padding: 6px 10px; border-radius: 6px; }
  .race .badge.wait { background: #e9ecef; color: var(--sub); }
  .lane { display: grid; grid-template-columns: 52px 1fr auto 64px; align-items: center; border-top: 1px solid var(--line); min-height: 52px; }
  .lane .wk { align-self: stretch; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; }
  .lane .nm { padding: 0 12px; font-size: 18px; font-weight: 700; }
  .lane .br { text-align: center; color: var(--ink); font-weight: 600; padding-right: 8px; }
  .lane .pl { font-size: 13px; color: var(--sub); text-align: center; }
  .lane .pl.p1 { color: var(--hit); font-weight: 800; font-size: 15px; }
  .k1 { background: #f1f3f5; color: #000; } .k2 { background: #111; color: #fff; } .k3 { background: #e03131; color: #fff; }
  .k4 { background: #1971c2; color: #fff; } .k5 { background: #ffe03d; color: #000; } .k6 { background: #0ca678; color: #fff; }
  .cls { display: inline-block; font-size: 13px; font-weight: 800; padding: 2px 6px; border-radius: 4px; color: #fff; min-width: 2.4em; text-align: center; }
  .cls.A1 { background: #e8590c; } .cls.A2 { background: #f59f00; } .cls.B1 { background: #1c7ed6; } .cls.B2 { background: #868e96; }
  .res { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 14px; display: flex; gap: 14px; flex-wrap: wrap; color: var(--sub); }
  .res b { color: var(--ink); font-size: 16px; }
  .race .acts { border-top: 1px solid var(--line); padding: 10px 14px; }
  .race .acts button { width: 100%; border: 1.5px solid #1d2733; border-radius: 999px; padding: 10px; font-weight: 700; }

  /* ---- 詳細 */
  .tbl { width: 100%; overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; white-space: nowrap; }
  th, td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: center; }
  th { color: var(--sub); font-weight: 500; font-size: 12px; }
  td.name { text-align: left; }
  td.name small { color: var(--sub); }
  .waku { display: inline-block; width: 26px; height: 26px; line-height: 24px; border-radius: 6px; font-weight: 700; border: 1px solid #999; }
  .w1 { background: #fff; color: #000; } .w2 { background: #222; color: #fff; } .w3 { background: #e03131; color: #fff; }
  .w4 { background: #1c7ed6; color: #fff; } .w5 { background: #fcc419; color: #000; } .w6 { background: #2f9e44; color: #fff; }
  td.name .cls { font-size: 11px; margin-left: 4px; padding: 1px 4px; }
  .p1 { color: var(--hit); font-weight: 700; }
  .pay { display: grid; grid-template-columns: 4.5em 1fr auto auto; gap: 4px 10px; font-size: 14px; margin-top: 10px; }
  .pay .k { color: var(--sub); }
  .pay .y { text-align: right; font-variant-numeric: tabular-nums; }
  .pay .pp { color: var(--sub); font-size: 12px; }
  .nm[data-reg] { color: var(--accent); cursor: pointer; }
  td.name .nm { text-decoration: underline; text-decoration-color: #b8cff0; }

  /* ---- 詳細タブ */
  .dtabs { display: flex; margin-top: 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .dtabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 8px 4px; color: var(--sub); font-weight: 700; white-space: nowrap;
    border-bottom: 3px solid transparent; }
  .dtabs button.on { color: var(--ink); border-bottom-color: var(--ink); background: none; }
  .pill2 { border-radius: 999px !important; padding: 6px 14px !important; font-weight: 700; }
  .pill2.on { background: var(--ink) !important; border-color: var(--ink) !important; }
  table.cmp td { padding: 6px 4px; }
  table.cmp td.lk { width: 34px; font-weight: 800; font-size: 16px; padding: 0; }
  table.cmp td.name { min-width: 92px; font-weight: 700; }
  table.cmp .pv { font-size: 15px; }
  .cnt { color: #98a1ad; }
  td.r1 .pv, td.r1 { }
  td.r1 { background: #ffd8cc; } td.r2 { background: #fff3bf; }
  td.bad .pv { color: #e03131; }
  td.moved { color: #e03131; font-weight: 800; }
  .new { color: #e03131; font-weight: 800; }
  .part { display: inline-block; background: #fff0f6; color: #c2255c; border-radius: 4px; padding: 1px 5px; margin: 1px; font-size: 12px; }
  .mini { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; font-weight: 800; border-radius: 4px; font-size: 13px; border: 1px solid #ccd; }
  td.combo { white-space: nowrap; letter-spacing: 1px; }
  tr.hit td { background: #d3f9d8 !important; font-weight: 800; }
  .slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
  .slot small { color: var(--sub); font-size: 11px; }
  .slot.on { background: #fff3bf; border-color: #f59f00; color: var(--ink); }
  .slot.cutbtn.on { background: #f1f3f5; border-color: #868e96; }
  .slot.cutbtn.on .mini { opacity: .35; }
  .slot.cutbtn.on small { color: #e03131; font-weight: 800; }
  tr.cutrow td { color: #adb5bd; }
  .slot .mini { width: 30px; height: 30px; line-height: 30px; font-size: 16px; }
  table.wt { font-size: 12px; margin-top: 4px; }
  table.wt td, table.wt th { padding: 4px 2px; }
  table.wt td.na { color: #ccd; }
  .stb { display: inline-block; font-size: 11px; font-weight: 800; margin-left: 4px; padding: 1px 4px; border-radius: 4px; background: #eef2f7; color: #495057; }
  .stb:empty { display: none; }
  .stb.fast { background: #ffe3e3; color: #c92a2a; } .stb.slow { background: #e7f5ff; color: #1864ab; }
  /* ---- 出走表(縦線つき) */
  table.grid2 { border: 1px solid var(--line); }
  table.grid2 th, table.grid2 td { border-left: 1px solid var(--line); padding: 4px 6px; vertical-align: middle; }
  table.grid2 th { background: #f6f8fb; line-height: 1.3; }
  table.grid2 td.lk { width: 30px; font-weight: 800; font-size: 17px; padding: 0; }
  table.grid2 td.name { min-width: 110px; font-weight: 700; line-height: 1.5; }
  table.grid2 td.name small { font-weight: 400; }
  table.grid2 .v { padding: 3px 4px; border-radius: 3px; font-variant-numeric: tabular-nums; }
  table.grid2 .v.sub { font-size: 13px; color: #495057; margin-top: 2px; }
  .v.pk { background: #ffc9de; } .v.ye { background: #fff3bf; }
  .red { color: #e03131; font-weight: 800; }
  .meet { display: flex; align-items: stretch; }
  .mday { display: flex; flex-direction: column; padding: 0 4px; border-left: 2px solid #868e96; }
  .mday:first-child { border-left: none; padding-left: 0; }
  .mdl { font-size: 11px; color: var(--sub); text-align: center; margin-bottom: 2px; white-space: nowrap; }
  .mrs { display: flex; gap: 3px; }
  .mr { display: flex; flex-direction: column; align-items: center; min-width: 34px; font-size: 12px; line-height: 1.5; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .mh { width: 100%; text-align: center; font-weight: 800; font-size: 11px; }
  .msep { width: 2px; background: #adb5bd; margin: 0 2px; }
  b.p23 { color: #1971c2; }
  td.mcell { min-width: 120px; }
  .oh { font-size: 15px; margin: 14px 0 4px; }
  table.odds td, table.odds th { text-align: center; font-size: 13px; padding: 4px; }
  table.odds td.na { color: #ccd; background: #f8f9fa; }
  .hitc { background: #b2f2bb !important; font-weight: 800; }
  .ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px; }
  .oi { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; font-size: 13px; }
  .ogrid .oi:nth-child(odd) { background: #f6f8fb; }
  .oblk { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; gap: 0 !important; }
  .oblk .obh { background: #eef2f7; padding: 4px 6px; border-bottom: 1px solid #ced4da; }
  .oblk .oi { border: none; border-radius: 0; border-bottom: 1px solid var(--line); padding: 3px 6px; }
  .oblk .oi:nth-child(even) { background: #f6f8fb; }
  .oblk .oi:nth-child(4n+1) { border-bottom: 1px solid #adb5bd; }
  .oi .mini { width: 18px; height: 18px; line-height: 18px; font-size: 11px; margin-right: 1px; }
  .o3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 6px; }
  .oblk { display: flex; flex-direction: column; gap: 3px; }
  .obh { font-weight: 800; font-size: 13px; }
  table.paytbl { width: auto; min-width: 320px; max-width: 700px; }
  table.paytbl th[rowspan] { background: #f6f8fb; font-weight: 700; color: var(--ink); white-space: nowrap; }
  table.paytbl tr.first td, table.paytbl tr.first th { border-top: 2px solid #adb5bd; }
  table.paytbl td.yen { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
  table.paytbl td.combo { text-align: left; }
  table.paytbl td.val { background: #d3f9d8; font-weight: 700; color: #2b8a3e; }
  .sepc { margin: 0 2px; color: var(--sub); }
  /* ---- オッズタブ */
  .otypes { background: #eef2f7; border-radius: 10px; padding: 3px; display: inline-flex; gap: 2px; flex-wrap: wrap; }
  .otypes button { border: 0; background: none; color: var(--sub); font-weight: 700; padding: 7px 12px; border-radius: 8px; }
  .otypes button.on { background: var(--ink); color: #fff; }
  .orow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  .otime { color: var(--sub); font-size: 13px; }
  .otag { border: 1.5px solid #e03131; color: #e03131; font-weight: 700; padding: 3px 8px; border-radius: 4px; font-size: 13px; }
  table.otbl { border-collapse: collapse; width: 100%; font-size: 14px; }
  table.otbl th, table.otbl td { border: 1px solid var(--line); padding: 5px 4px; text-align: center; }
  table.otbl th { font-weight: 800; font-size: 13px; }
  table.otbl td.oc { text-align: right; padding-right: 8px; font-variant-numeric: tabular-nums; cursor: pointer; min-width: 52px; }
  table.otbl td.ob2, table.otbl td.ob3 { font-weight: 800; width: 26px; }
  table.otbl td.na { background: #f8f9fa; }
  table.otbl .osel, table.otbl tr.osel td { background: #dbe7ff !important; }
  table.t3 { font-size: 13px; }
  table.otbl.rank tr.oc { cursor: pointer; }
  table.otbl.form .chk, .chk2 { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #ced4da; background: #fff; color: #adb5bd; font-weight: 800; padding: 0; }
  table.otbl.form .chk.on { background: #1971c2; border-color: #1971c2; color: #fff; }
  .chk2 { border-radius: 8px; width: auto; min-width: 38px; height: 34px; color: var(--ink); }
  .memofab { position: fixed; right: 18px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 8; width: 74px; height: 74px; border-radius: 50%;
    background: #1971c2; color: #fff; border: 0; box-shadow: 0 4px 12px rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; }
  .memofab span { font-size: 10px; font-weight: 700; }
  .memofab b { position: absolute; top: -4px; right: -4px; background: #e64980; color: #fff; border-radius: 50%; width: 24px; height: 24px; line-height: 24px; font-size: 13px; }
  input.amt { width: 56px; font-size: 16px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; text-align: right; }
  #mmode { font-size: 15px; padding: 6px; border-radius: 6px; border: 1px solid var(--line); }
  table.memo td.payc { text-align: right; }
  .pop { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
  .pop.over { background: #ffe3e3; color: #c92a2a; } .pop.fair { background: #f1f3f5; color: #495057; } .pop.under { background: #d3f9d8; color: #2b8a3e; }
  table.memo td.val { background: #d3f9d8; font-weight: 700; color: #2b8a3e; }
  .plus { color: #2b8a3e; font-weight: 700; } .minus { color: #e03131; font-weight: 700; }
  table.st34 td.c4, table.st34 th.c4 { background: #f3f8ff; }
  table.st34 td { text-align: center; }
  /* ---- 場データ・選手 */
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .seg button { padding: 4px 10px; }
  .own td { font-weight: 700; background: #f7faff; }
  .hi { color: var(--hit); font-weight: 700; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  #modal[hidden] { display: none; }
  #modal .sheet { background: var(--bg); width: 100%; max-width: 900px; max-height: 88vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); }
  #modal .close { float: right; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
  nav button { flex: 1; border: 0; border-radius: 0; padding: 12px 0; background: none; color: var(--sub); }
  nav button.on { color: var(--accent); font-weight: 700; background: none; }
</style>
</head>
<body>
<div class="bar" id="bar"><div class="in" id="barIn"></div></div>

<main id="view-race"></main>
<main id="view-venue" hidden></main>
<main id="view-bets" hidden>
  <div class="card" style="color:var(--sub)">舟券の収支記録は次の段階で作ります。</div>
</main>

<nav>
  <button class="on" data-view="race">レース</button>
  <button data-view="venue">場データ</button>
  <button data-view="bets">収支</button>
</nav>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
const BETS = ["単勝", "複勝", "2連単", "2連複", "拡連複", "3連単", "3連複"];
const NIGHT = ["01", "07", "12", "15", "19", "20", "24"];
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const state = { index: null, day: null, date: null, venue: null, race: 1, screen: "home", tab: "race" };
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const fmt = (v, d = 2) => (v === null || v === undefined) ? "-" : Number(v).toFixed(d);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function statusText(s) {
  if (!s) return "";
  return ({ S: "失格", K: "欠場", L: "出遅", F: "F" })[s[0]] || s;
}
function nowJST() {
  const d = new Date(Date.now() + 9 * 3600 * 1000);
  return { date: d.toISOString().slice(0, 10), time: d.toISOString().slice(11, 16) };
}
function dateLabel(date) {
  const [y, m, d] = date.split("-").map(Number);
  const w = WD[new Date(y, m - 1, d).getDay()];
  return `${date === nowJST().date ? "本日" : ""}${m}月${d}日(${w})`;
}

async function getJSON(path) {
  const r = await fetch(path + "?t=" + Date.now());
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function init() {
  try {
    state.index = await getJSON("data/index.json");
  } catch (e) {
    $("view-race").innerHTML = '<div class="empty">まだデータがありません。</div>';
    return;
  }
  const list = dayList();
  const today = nowJST().date;
  const start = list.includes(today) ? today : list[list.length - 1];
  await loadDay(start);
}

function dayList() { return state.index.days.map((d) => d.date); }

async function loadDay(date) {
  state.date = date;
  try {
    state.day = await getJSON(`data/races/${date.slice(0, 4)}/${date.replace(/-/g, "")}.json`);
  } catch (e) {
    state.day = null;
  }
  if (state.screen !== "home" && !state.day?.venues[state.venue]) state.screen = "home";
  draw();
}

function go(screen, opts = {}) {
  Object.assign(state, opts, { screen });
  if (opts.venue) store.set("venue", opts.venue);
  draw();
  window.scrollTo(0, 0);
  if (screen === "list") scrollToNext();
}

// 今日なら、直近で締切を過ぎたレースの次(=次に締切が来るレース)まで送る
function scrollToNext() {
  const now = nowJST();
  if (state.date !== now.date) return;
  const races = Object.values(state.day.venues[state.venue].races).sort((a, b) => a.no - b.no);
  const next = races.find((r) => r.deadline && r.deadline > now.time);
  if (!next || next.no === races[0].no) return;
  const el = document.getElementById("r" + next.no);
  if (!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY - $("bar").offsetHeight - 10;
  window.scrollTo(0, y);
}

function draw() {
  if (state.tab !== "race") { $("bar").hidden = true; return; }
  $("bar").hidden = false;
  if (state.screen === "home") drawHome();
  else if (state.screen === "list") drawList();
  else drawDetail();
}

// ---------------------------------------------------------------- 場選択
function venueStatus(v) {
  const races = Object.values(v.races).sort((a, b) => a.no - b.no);
  const now = nowJST();
  if (state.date < now.date) return { text: "開催終了", done: true };
  if (state.date > now.date) return { text: `1R ${races[0]?.deadline || ""}`, done: false };
  const next = races.find((r) => r.deadline && r.deadline > now.time && !r.payouts);
  return next ? { text: `${next.no}R ${next.deadline}`, done: false } : { text: "開催終了", done: true };
}
function gradeBadge(v) {
  if (!v.grade) return "";
  const cls = { SG: "gsg", G1: "gg1", G2: "gg2", G3: "gg3" }[v.grade] || "gip";
  const t = { "ヴィーナス": "💗", "ルーキー": "🔰", "レディース": "👩", "マスターズ": "🎖" }[v.gtype] || "";
  return `<span class="gb ${cls}">${esc(v.grade)}</span>${t ? `<span class="gt" title="${esc(v.gtype)}">${t}</span>` : ""}`;
}
function dayText(v) {
  if (v.final) return '<span class="tag final">最終日</span>';
  if (v.day === 1) return "初日";
  return v.day ? `${v.day}日目` : "";
}

function drawHome() {
  const list = dayList();
  const prev = list.filter((d) => d < state.date).pop();
  const next = list.find((d) => d > state.date);
  $("barIn").innerHTML = `
    <div class="datenav">
      <button class="pill" id="prev" ${prev ? "" : "disabled"}>◀ 前日</button>
      <div class="label">${dateLabel(state.date)}<span class="wide">のレース</span><span class="cal">📅</span>
        <input type="date" id="pick" value="${state.date}" min="${list[0]}" max="${list[list.length - 1]}"></div>
      <button class="pill" id="next" ${next ? "" : "disabled"}>翌日 ▶</button>
    </div>`;
  $("prev").onclick = () => prev && loadDay(prev);
  $("next").onclick = () => next && loadDay(next);
  $("pick").onchange = (ev) => ev.target.value && loadDay(ev.target.value);

  const cells = Object.entries(state.index.venues).map(([code, name]) => {
    const v = state.day?.venues[code];
    if (!v) return `<div class="cell off"><div class="vn">${esc(name)}</div></div>`;
    const s = venueStatus(v);
    return `<button class="cell" data-v="${code}">
      <div class="gbr">${gradeBadge(v)}</div>
      <div class="vn">${esc(name)}</div>
      <div class="dl">${dayText(v)}${NIGHT.includes(code) ? '<span class="night">🌙</span>' : ""}</div>
      <div class="st ${s.done ? "done" : ""}">${s.text}</div>
      <div class="tt">${esc(v.title || "")}</div>
    </button>`;
  }).join("");
  $("view-race").innerHTML = `<div class="grid">${cells}</div>
    <div class="updated">データ更新 ${esc(state.index.updated)}</div>`;
  $("view-race").querySelectorAll("[data-v]").forEach((b) =>
    b.addEventListener("click", () => go("list", { venue: b.dataset.v })));
}

function drawDetail() {
  const v = state.day.venues[state.venue];
  const nos = Object.keys(v.races).map(Number).sort((a, b) => a - b);
  const tabs = [["card", "出走表"], ["racer", "選手成績"], ["exh", "展示"], ["motor", "モーター"], ["odds", "オッズ"], ["deme", "出目確率"], ["result", "結果"]];
  state.dtab = state.dtab || "card";
  $("barIn").innerHTML = `
    <button class="back" id="back">‹ ${esc(v.name)}の一覧</button>

    <div class="dtabs">${tabs.map(([k, l]) => `<button data-t="${k}" class="${k === state.dtab ? "on" : ""}">${l}</button>`).join("")}</div>`;
  $("back").onclick = () => go("list");

// 数値の良い順に 1番=ピンク、2番=黄色。higher=true なら大きいほど良い
function rankCls(values, higher = true) {
  // 表示している桁で比べる(同じ表示なら同じ色)
  const v = values.map((x) => (x == null || Number.isNaN(Number(x)) ? null : Math.round(Number(x) * 100) / 100));
  const uniq = [...new Set(v.filter((x) => x != null))].sort((a, b) => higher ? b - a : a - b);
  return v.map((x) => x == null ? "" : x === uniq[0] ? "pk" : x === uniq[1] ? "ye" : "");
}

async function drawCardTab(v, race) {
  loading();
  const [files, meet] = await Promise.all([

  const E = race.entries;
  const sh = files.map((f) => f?.sheet?.all);
  const stAvg = sh.map((s) => s?.st?.total?.avg ?? null);
  const stCourse = E.map((e, i) => sh[i]?.st?.[`c${e.course || e.boat}`]?.avg ?? null);

    motor2: rankCls(E.map((e) => e.motor_2 != null ? Math.round(e.motor_2 * 10) / 10 : null)),
    boat2: rankCls(E.map((e) => e.boat_2 != null ? Math.round(e.boat_2 * 10) / 10 : null)),
    exh: rankCls(E.map((e) => e.exh), false),
    st: rankCls(E.map((e) => (/^\d?\.\d+$/.test(e.st || "") ? Number(e.st) : null)), false),
  };
  const fst = (x) => x == null ? "-" : x.toFixed(2).replace(/^0/, "");
  const two = (a, ca, b, cb) => `<div class="v ${ca}">${a}</div><div class="v sub ${cb}">${b}</div>`;
  const hasResult = false;  // 結果は「結果」タブへ

  const rows = E.map((e, i) => {
    const s = sh[i];

    return `<tr>
      <td class="lk k${e.boat}">${e.boat}</td>
      <td class="name"><span class="nm" data-reg="${e.regno || ""}" data-course="${e.course || e.boat}">${esc(e.name || "")}</span>
        ${e.class ? `<br><span class="cls ${e.class}">${e.class}</span>` : ""}
        <br><small>${e.regno || ""} ${esc(e.branch || "")} ${e.age ? e.age + "歳" : ""}${e.weight ? ` ${e.weight}kg` : ""}</small></td>
      <td>${two(fst(stAvg[i]), col.stAvg[i], `${e.course || e.boat}コ ${fst(stCourse[i])}<small class="cnt">(${stCourseN[i]})</small>`, col.stCourse[i])}</td>
      <td>${two(`<span class="${f ? "red" : ""}">F${f}</span>`, "", `<span class="${l ? "red" : ""}">L${l}</span>`, "")}</td>
      <td>${two(fmt(e.nat_win), col.natWin[i], `${fmt(e.nat_2, 1)}%`, col.nat2[i])}</td>
      <td>${two(fmt(e.loc_win), col.locWin[i], `${fmt(e.loc_2, 1)}%`, col.loc2[i])}</td>
      <td>${two(`<small>No.</small>${e.motor_no ?? "-"}`, "", `${fmt(e.motor_2, 1)}%`, col.motor2[i])}</td>
      <td>${two(`<small>No.</small>${e.boat_no ?? "-"}`, "", `${fmt(e.boat_2, 1)}%`, col.boat2[i])}</td>
      <td class="mcell">${meetCell(meet[e.regno])}</td>
      ${hasResult ? `<td>${two(e.exh != null ? fmt(e.exh) : "-", col.exh[i], `進入 ${e.course ?? "-"}`, "")}</td>
      <td>${two(esc(e.st ?? "-"), col.st[i], `<b class="${e.place === 1 ? "p1" : ""}">${e.place ? e.place + "着" : esc(statusText(e.status) || "-")}</b>`, "")}</td>` : ""}
    </tr>`;
  }).join("");

  let pay = "";
  if (race.payouts && Object.keys(race.payouts).length) {
    pay = '<div class="pay">' + BETS.filter((b) => race.payouts[b]).map((b) =>
      race.payouts[b].map((p, i) => `
        <span class="k">${i === 0 ? b : ""}</span><span>${p.combo}</span>

      ).join("")).join("") + "</div>";

  $("view-race").innerHTML = `
    <div class="card">
      <h2>${esc(v.name)} ${race.no}R ${esc(race.name || "")}</h2>
      <div class="meta">${meta}</div>
      <div class="tbl"><table class="grid2">
        <thead><tr><th>枠</th><th>選手</th><th>平均ST<br><small>コース別</small></th><th>F<br>L</th>

        <tbody>${rows}</tbody>
      </table></div>
      <div class="note">数値ごとに、いちばん良いものをピンク、2番目を黄色にしています（STと展示は小さいほど良い）。平均STは直近1年（フライング・出遅れを除く）、下の段はこのレースのコースでの平均STと本数。F・Lは直近1年の回数。今節成績はこの節のこれまでのレース（R・進入コース・ST・着順）。結果と払戻金は「結果」タブにあります。</div>
    </div>
`;
}

// ---------------------------------------------------------------- 今節成績
// この節(同じ場・同じ開催名)のこれまでのレースから、選手ごとの成績を集める
async function meetHistory(race) {
  const v = state.day.venues[state.venue];
  const out = {};
  const [y, m, d] = state.date.split("-").map(Number);
  for (let back = 0; back < 9; back++) {
    const dt = new Date(Date.UTC(y, m - 1, d - back));
    const ds = dt.toISOString().slice(0, 10);
    const day = back === 0 ? state.day : await cached(`data/races/${ds.slice(0, 4)}/${ds.replace(/-/g, "")}.json`);
    const vv = day?.venues?.[state.venue];
    if (!vv || (v.title && vv.title !== v.title)) { if (back > 0) break; else continue; }
    Object.values(vv.races).forEach((r) => {
      if (back === 0 && r.no >= race.no) return;
      r.entries.forEach((e) => {
        if (e.place == null && !e.status) return;  // 結果が出ていない
        (out[e.regno] = out[e.regno] || []).push({ date: ds, dayNo: vv.day, final: vv.final, no: r.no, boat: e.boat,
          course: e.course, st: e.st, place: e.place, status: e.status });
      });
    });
  }
  Object.values(out).forEach((a) => a.sort((p, q) => p.date.localeCompare(q.date) || p.no - q.no));
  return out;
}
function meetCell(list) {
  if (!list?.length) return '<span class="cnt">-</span>';
  // 日ごとにまとめて、日の名前(初日・○日目・最終日)を付ける
  const days = [];
  list.forEach((h) => {
    if (!days.length || days[days.length - 1].date !== h.date) days.push({ date: h.date, dayNo: h.dayNo, final: h.final, races: [] });
    days[days.length - 1].races.push(h);
  });
  const label = (d) => d.final ? "最終日" : d.dayNo === 1 ? "初日" : d.dayNo ? `${d.dayNo}日目` : d.date.slice(5).replace("-", "/");
  return `<div class="meet">${days.map((d) => `<div class="mday"><div class="mdl">${label(d)}</div><div class="mrs">${d.races.map((h) => {
    const pl = h.place ? h.place : statusText(h.status);
    return `<span class="mr"><span class="mh k${h.boat}">${h.no}R</span><span>${h.course ?? "-"}</span>
      <span class="cnt">${esc((h.st || "").replace(/^0/, ""))}</span><b class="${h.place === 1 ? "p1" : h.place && h.place <= 3 ? "p23" : ""}">${esc(pl)}</b></span>`;
  }).join("")}</div></div>`).join("")}</div>`;
}

// ---------------------------------------------------------------- 結果
async function getOdds(hd, venue, no) {
  const path = `data/odds/${hd}/${venue}_${String(no).padStart(2, "0")}.json`;
  try {
    const r = await fetch(RAW + path, { cache: "no-store" });
    if (r.ok) return await r.json();
  } catch (e) { /* なし */ }
  return getJSON(path).catch(() => null);
}

async function drawResultTab(v, race) {
  loading();
  const done = race.entries.some((e) => e.place != null || e.status);
  if (!done) {
    $("view-race").innerHTML = '<div class="empty">結果はまだです。結果は夜（23:37・1:07）と朝の取り込みで入ります。</div>';
    return;
  }
  const [od, dm] = await Promise.all([getOdds(state.date.replace(/-/g, ""), state.venue, race.no), computeDeme(race)]);
  if (state.dtab !== "result") return;
  const res = [1, 2, 3].map((p) => race.entries.find((e) => e.place === p)?.boat);
  const order = [...race.entries].sort((a, b) => (a.place ?? 9) - (b.place ?? 9));
  const w = race.weather;
  const rows = order.map((e) => `<tr>
      <td><b class="${e.place === 1 ? "p1" : ""}">${e.place ? e.place + "着" : esc(statusText(e.status) || "-")}</b></td>
      <td class="lk k${e.boat}">${e.boat}</td>
      <td class="name"><span class="nm" data-reg="${e.regno || ""}" data-course="${e.course || e.boat}">${esc(e.name || "")}</span>${e.class ? ` <span class="cls ${e.class}">${e.class}</span>` : ""}</td>
      <td>${e.course ?? "-"}</td><td>${esc(e.st ?? "-")}</td><td>${e.exh != null ? fmt(e.exh) : "-"}</td><td>${esc(e.time ?? "-")}</td></tr>`).join("");

  // 払戻金: 券種ごとに区切った表(組番は枠の色)
  let pay = "";
  if (race.payouts && Object.keys(race.payouts).length) {
    const badge = (combo) => combo.split("-").map((b) => `<span class="mini k${b}">${b}</span>`)
      .join(`<span class="sepc">${/連複|拡連複/.test(combo) ? "=" : "-"}</span>`);
    const norm = (b, combo) => /複/.test(b) ? combo.split("-").map(Number).sort().join("-") : combo;
    const demeCells = (b, combo, yen) => {
      if (!dm || !dm.prob[b]) return "<td>-</td><td>-</td>";
      const k = norm(b, combo), p = dm.prob[b][k], r = dm.rank[b][k];
      const value = p && yen / 100 > 1 / p;  // 払戻が目安オッズより高い = 確率のわりに配当が高い
      return `<td class="${value ? "val" : ""}">${p ? (1 / p).toFixed(1) + "<small>倍</small>" : "-"}</td><td>${r ? `<b class="${r <= 3 ? "p1" : ""}">${r}位</b><small class="cnt">/${dm.rank[b]._n}</small>` : "-"}</td>`;
    };
    pay = `<table class="grid2 paytbl"><thead><tr><th>券種</th><th>組番</th><th>払戻金</th><th>人気</th><th>目安オッズ</th><th>出目<br>ランキング</th></tr></thead><tbody>` +
      BETS.filter((b) => race.payouts[b]).map((b) => race.payouts[b].map((p, i) => `<tr class="${i === 0 ? "first" : ""}">
        ${i === 0 ? `<th rowspan="${race.payouts[b].length}">${b}</th>` : ""}
        <td class="combo">${p.combo.split("-").map((x) => `<span class="mini k${x}">${x}</span>`).join(`<span class="sepc">${/複/.test(b) ? "=" : "-"}</span>`)}</td>
        <td class="yen">${p.yen.toLocaleString()}<small>円</small></td>
        <td>${p.pop ? p.pop + "番人気" : "-"}</td>
        ${demeCells(b, p.combo, p.yen)}</tr>`).join("")).join("") + "</tbody></table>" +
      `<div class="note">目安オッズと出目ランキングは、出目確率タブと同じ計算（${dm?.exh ? "スタート展示の進入" : "枠なり"}・選んだ材料）での値です。払戻金÷100が目安オッズより大きい（確率のわりに配当が高かった）ものは緑にしています。過去のレースは、そのレース自体も成績の集計に入っているので、実際より少し当たりやすく見えます。</div>`;
  }

  // オッズ表
  const bb = (b) => `<span class="mini k${b}">${b}</span>`;
  const oc = (val, hit) => `<td class="${hit ? "hitc" : ""}">${val == null ? "-" : val.toFixed(1)}</td>`;
  let oddsHtml = '<div class="note">このレースのオッズはまだ取り込んでいません（結果のあとに取り込みます）。</div>';
  if (od) {
    const B = [1, 2, 3, 4, 5, 6];
    const t2 = `<table class="grid2 odds"><thead><tr><th>2着＼1着</th>${B.map((a) => `<th>${bb(a)}</th>`).join("")}</tr></thead><tbody>
      ${B.map((b) => `<tr><th>${bb(b)}</th>${B.map((a) => a === b ? '<td class="na">—</td>' : oc(od["2t"]?.[`${a}-${b}`], res[0] === a && res[1] === b)).join("")}</tr>`).join("")}</tbody></table>`;
    const f2 = `<table class="grid2 odds"><thead><tr><th></th>${B.slice(1).map((b) => `<th>${bb(b)}</th>`).join("")}</tr></thead><tbody>
      ${B.slice(0, 5).map((a) => `<tr><th>${bb(a)}</th>${B.slice(1).map((b) => b <= a ? '<td class="na"></td>' : oc(od["2f"]?.[`${a}=${b}`], [res[0], res[1]].sort().join() === [a, b].join())).join("")}</tr>`).join("")}</tbody></table>`;
    const trioKeys = Object.keys(od["3f"] || {}).sort();
    const resTrio = [...res].sort().join("=");
    const f3 = `<div class="ogrid">${trioKeys.map((k) => `<div class="oi ${k === resTrio ? "hitc" : ""}"><span>${k.split("=").map(Number).map(bb).join("")}</span><b>${od["3f"][k].toFixed(1)}</b></div>`).join("")}</div>`;
    const t3 = B.map((a) => `<div class="oblk"><div class="obh">${bb(a)} 1着</div>${B.filter((b) => b !== a).map((b) =>
      B.filter((c) => c !== a && c !== b).map((c) => {
        const k = `${a}-${b}-${c}`, val = od["3t"]?.[k];
        return `<div class="oi ${res.join("-") === k ? "hitc" : ""}"><span>${bb(b)}${bb(c)}</span><b>${val == null ? "-" : val.toFixed(1)}</b></div>`;
      }).join("")).join("")}</div>`).join("");
    oddsHtml = `
      <h3 class="oh">2連単</h3><div class="tbl">${t2}</div>
      <h3 class="oh">2連複</h3><div class="tbl">${f2}</div>
      <h3 class="oh">3連複</h3>${f3}
      <h3 class="oh">3連単</h3><div class="o3">${t3}</div>
      <div class="note">締切時オッズ。当たった目を緑にしています。</div>`;
  }

  $("view-race").innerHTML = `
    <div class="card">
      <h2>${esc(v.name)} ${race.no}R 結果</h2>
      <div class="meta">${w ? `<span>${esc(w.sky)} 風 ${esc(w.wind_dir)} ${w.wind}m 波 ${w.wave}cm</span>` : ""}
        ${race.kimarite ? `<span>決まり手 <b>${esc(race.kimarite)}</b></span>` : ""}</div>
      <div class="tbl"><table class="grid2"><thead><tr><th>着</th><th>枠</th><th>選手</th><th>進入</th><th>ST</th><th>展示</th><th>タイム</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
    ${pay ? `<div class="card"><h2>払戻金</h2>${pay}</div>` : ""}
    <div class="card"><h2>オッズ</h2>${oddsHtml}</div>`;
}

// ---------------------------------------------------------------- オッズタブ
// 種類: 3t=3連単 3f=3連複 2t=2連単 2f=2連複 k=拡連複 1t=単勝 1f=複勝
const OTYPES = [["3t", "3連単"], ["3f", "3連複"], ["2tf", "2連単・2連複"], ["k", "拡連複"], ["tf", "単勝・複勝"]];
const ONAME = { "3t": "3連単", "3f": "3連複", "2t": "2連単", "2f": "2連複", k: "拡連複", "1t": "単勝", "1f": "複勝" };
const DEME_KEY = { "3t": "3連単", "3f": "3連複", "2t": "2連単", "2f": "2連複", k: "拡連複", "1t": "単勝", "1f": "複勝" };
const ORDERED = { "3t": true, "2t": true };

// 最新のオッズ: GitHub の API から直接(サイトの公開を待たない)。なければ締切時オッズ
async function getLive(hd, venue, no) {
  const path = `data/live/${hd}/${venue}_${String(no).padStart(2, "0")}.json`;
  try {
    const r = await fetch(`https://api.github.com/repos/suzuhaya5666-lgtm/boatdata/contents/${path}?ref=main`,
      { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" });
    if (r.ok) return await r.json();
  } catch (e) { /* 次へ */ }
  try {
    const r = await fetch(RAW + path, { cache: "no-store" });
    if (r.ok) return await r.json();
  } catch (e) { /* 次へ */ }
  return getJSON(path).catch(() => null);
}
const oval = (od, t, k) => od?.[t]?.[k];
const olo = (v) => Array.isArray(v) ? v[0] : v;  // 幅のあるオッズは下限で計算
const ofmt = (v) => v == null ? "-" : Array.isArray(v) ? `${v[0].toFixed(1)}-${v[1].toFixed(1)}` : v.toFixed(1);
const keyOf = (t, boats) => ORDERED[t] ? boats.join("-") : [...boats].sort().join("=");
const demeKey = (t, k) => k.replace(/=/g, "-");

// 買い目メモ(レースごとに端末に保存)
function memoKey() { return `memo_${state.date}_${state.venue}_${state.race}`; }
function memoLoad() { try { return JSON.parse(localStorage.getItem(memoKey()) || "[]"); } catch (e) { return []; } }
function memoSave(list) { try { localStorage.setItem(memoKey(), JSON.stringify(list)); } catch (e) { /* 保存できない環境 */ } }
function memoHas(t, k) { return memoLoad().some((m) => m.t === t && m.k === k); }
function memoToggle(t, k, on) {
  let list = memoLoad();
  const has = list.some((m) => m.t === t && m.k === k);
  if (on === undefined) on = !has;
  if (on && !has) list.push({ t, k, amt: 100 });
  if (!on) list = list.filter((m) => !(m.t === t && m.k === k));
  memoSave(list);
}

async function drawOddsTab(v, race, force) {
  if (!force) loading();
  const hd = state.date.replace(/-/g, "");
  const [live, fin, dm] = await Promise.all([getLive(hd, state.venue, race.no), getOdds(hd, state.venue, race.no), computeDeme(race)]);
  if (state.dtab !== "odds") return;
  state.memoDm = dm;  // 買い目メモで目安オッズに使う
  const finished = race.entries.some((e) => e.place != null || e.status);
  // 終わったレースは締切時オッズを優先(単勝・複勝・拡連複は最後に取れた分)
  const od = finished && fin ? { ...(live || {}), ...fin, time: null } : (live || fin);
  state.otype = state.otype || "3t";
  state.oview = state.oview || "normal";
  const ents = Object.fromEntries(race.entries.map((e) => [e.boat, e]));
  const bb = (b) => `<span class="mini k${b}">${b}</span>`;
  const done = race.entries.some((e) => e.place != null || e.status);

  // 状態の表示
  let status;
  if (od) {
    status = od.time ? `<span class="otime">オッズ更新 ${esc(od.time)}（5分ごとに取り込み）</span>` : '<span class="otag">締切時オッズ</span>';
  }
  let minsLeft = null;
  if (state.date === nowJST().date && race.deadline) {
    const [h, m] = race.deadline.split(":").map(Number);
    const [nh, nm] = nowJST().time.split(":").map(Number);
    minsLeft = (h * 60 + m) - (nh * 60 + nm);
  }
  const head = `
    <div class="seg otypes">${OTYPES.map(([k, l]) => `<button class="${k === state.otype ? "on" : ""}" data-ot="${k}">${l}</button>`).join("")}</div>
    <div class="seg">${[["normal", "通常"], ["pop", "人気順"], ["high", "高配当順"], ["form", "フォーメーション"]].map(([k, l]) =>
      `<button class="pill2 ${k === state.oview ? "on" : ""}" data-ov="${k}">${l}</button>`).join("")}</div>
    <div class="orow">${status || ""}<button class="pill2" id="oreload">⟳ オッズ取得</button></div>`;

  if (!od) {
    const when = minsLeft != null && minsLeft > 20 ? `締切20分前（あと${minsLeft - 20}分）から` : "締切20分前から";
    $("view-race").innerHTML = `<div class="card">${head}
      <div class="empty">まだオッズがありません。<br>${when}5分ごとに取り込みます。<br>「オッズ取得」で最新を読み込みます。</div></div>`;
    bindOdds(v, race);
    return;
  }

  // 確率と期待値
  const prob = (t, k) => dm?.prob?.[DEME_KEY[t]]?.[demeKey(t, k)] ?? null;
  // オッズから見た確率(券種ごとに 1/オッズ を合計100%にそろえる=控除分を除く)と、出目確率を比べる
  const mktSum = {};
  Object.keys(od).forEach((t) => {
    if (typeof od[t] !== "object" || !od[t]) return;
    mktSum[t] = Object.values(od[t]).reduce((a, v) => a + (olo(v) > 0 ? 1 / olo(v) : 0), 0);
  });
  const evCell = (t, k, val) => {
    const p = prob(t, k);
    if (p == null || val == null || !(olo(val) > 0) || !mktSum[t]) return "<td>-</td><td>-</td><td>-</td>";
    const q = (1 / olo(val)) / mktSum[t];
    const r = p / q;  // 1より小さい=オッズほど来ない(買われすぎ)
    const [lab, cls] = r < 0.8 ? ["過剰人気", "over"] : r > 1.25 ? ["過小人気", "under"] : ["そんなもん", "fair"];
    return `<td>${(p * 100).toFixed(1)}%</td><td>${(q * 100).toFixed(1)}%</td><td><span class="pop ${cls}">${lab}</span></td>`;
  };
  const sel = (t, k) => memoHas(t, k) ? "osel" : "";
  const cell = (t, k, extra = "") => {
    const val = oval(od, t, k);
    return `<td class="oc ${sel(t, k)} ${extra}" data-t="${t}" data-k="${k}">${ofmt(val)}</td>`;
  };
  const B = [1, 2, 3, 4, 5, 6];
  const headBoats = B.map((b) => `<th class="k${b}">${b}.${esc(ents[b]?.name || "")}</th>`).join("");
  let body = "";
  const types = state.otype === "2tf" ? ["2t", "2f"] : state.otype === "tf" ? ["1t", "1f"] : [state.otype];

  if (state.oview === "normal") {
    if (state.otype === "3t") {
      // 1着ごとの列。2着(4行まとめて)・3着・オッズ
      const rows = [];
      for (let r = 0; r < 20; r++) {
        rows.push("<tr>" + B.map((a) => {
          const seconds = B.filter((x) => x !== a);
          const sIdx = Math.floor(r / 4), b = seconds[sIdx];
          const thirds = B.filter((x) => x !== a && x !== b), c = thirds[r % 4];
          return `${r % 4 === 0 ? `<td rowspan="4" class="k${b} ob2">${b}</td>` : ""}<td class="k${c} ob3">${c}</td>${cell("3t", `${a}-${b}-${c}`)}`;
        }).join("") + "</tr>");
      }
      body = `<div class="tbl"><table class="otbl t3"><thead><tr>${B.map((b) => `<th colspan="3" class="k${b}">${b}.${esc(ents[b]?.name || "")}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
    } else if (state.otype === "3f") {
      const keys = Object.keys(od["3f"] || {}).sort();
      body = `<div class="tbl"><table class="otbl"><thead><tr><th>組番</th><th>オッズ</th><th>組番</th><th>オッズ</th></tr></thead><tbody>${
        Array.from({ length: Math.ceil(keys.length / 2) }, (_, i) => [keys[i], keys[i + Math.ceil(keys.length / 2)]]).map((pair) =>
          "<tr>" + pair.map((k) => k ? `<td>${k.split("=").map(Number).map(bb).join("=")}</td>${cell("3f", k)}` : "<td></td><td></td>").join("") + "</tr>").join("")}</tbody></table></div>`;
    } else if (state.otype === "2tf") {
      const t2 = `<h3 class="oh">2連単</h3><div class="tbl"><table class="otbl"><thead><tr>${B.map((b) => `<th colspan="2" class="k${b}">${b}.${esc(ents[b]?.name || "")}</th>`).join("")}</tr></thead><tbody>${
        [0, 1, 2, 3, 4].map((r) => "<tr>" + B.map((a) => { const b = B.filter((x) => x !== a)[r]; return `<td class="k${b} ob3">${b}</td>${cell("2t", `${a}-${b}`)}`; }).join("") + "</tr>").join("")}</tbody></table></div>`;
      const f2 = `<h3 class="oh">2連複</h3><div class="tbl"><table class="otbl"><thead><tr><th></th>${B.slice(1).map((b) => `<th class="k${b}">${b}</th>`).join("")}</tr></thead><tbody>${
        B.slice(0, 5).map((a) => `<tr><th class="k${a}">${a}</th>${B.slice(1).map((b) => b <= a ? '<td class="na"></td>' : cell("2f", `${a}=${b}`)).join("")}</tr>`).join("")}</tbody></table></div>`;
      body = t2 + f2;
    } else if (state.otype === "k") {
      body = `<div class="tbl"><table class="otbl"><thead><tr><th></th>${B.slice(1).map((b) => `<th class="k${b}">${b}</th>`).join("")}</tr></thead><tbody>${
        B.slice(0, 5).map((a) => `<tr><th class="k${a}">${a}</th>${B.slice(1).map((b) => b <= a ? '<td class="na"></td>' : cell("k", `${a}=${b}`)).join("")}</tr>`).join("")}</tbody></table></div>
        ${od.k ? "" : '<div class="note">拡連複のオッズは、締切20分前からの取り込み分にだけあります。</div>'}`;
    } else {
      body = `<div class="tbl"><table class="otbl"><thead><tr><th>枠</th><th>選手</th><th>単勝</th><th>複勝</th></tr></thead><tbody>${
        B.map((b) => `<tr><td class="k${b} ob3">${b}</td><td class="name">${esc(ents[b]?.name || "")}</td>${cell("1t", `${b}`)}${cell("1f", `${b}`)}</tr>`).join("")}</tbody></table></div>
        ${od["1t"] ? "" : '<div class="note">単勝・複勝のオッズは、締切20分前からの取り込み分にだけあります。</div>'}`;
    }
    body += '<div class="note">オッズをタップすると買い目メモに入ります（もう一度タップで外れます）。</div>';
  } else if (state.oview === "pop" || state.oview === "high") {
    body = types.map((t) => {
      const list = Object.entries(od[t] || {}).filter(([, val]) => olo(val) > 0)
        .sort((x, y) => state.oview === "pop" ? olo(x[1]) - olo(y[1]) : olo(y[1]) - olo(x[1]));
      return `${types.length > 1 ? `<h3 class="oh">${ONAME[t]}</h3>` : ""}<div class="tbl"><table class="otbl rank"><thead><tr><th>順位</th><th>組番</th><th>オッズ</th><th>出目確率</th><th>オッズの<br>確率</th><th>人気の評価</th></tr></thead><tbody>${
        list.map(([k, val], i) => `<tr class="${sel(t, k)}"><td>${i + 1}位</td><td>${k.split(/[-=]/).map(Number).map(bb).join(ORDERED[t] ? "-" : "=")}</td>${cell(t, k)}${evCell(t, k, val)}</tr>`).join("")}</tbody></table></div>`;
    }).join("") + '<div class="note">オッズの確率は、オッズから見た「みんなが思っている確率」（控除分を除いて合計100%にそろえた値）。出目確率がそれより2割以上低ければ「過剰人気」（買われすぎ）、2割5分以上高ければ「過小人気」（狙い目）、その間は「そんなもん」。</div>';
  } else {
    body = drawFormation(od, ents, types);
  }

  const memo = memoLoad();
  $("view-race").innerHTML = `<div class="card">${head}${body}</div>
    <button class="memofab" id="memofab">📝<span>買い目メモ</span>${memo.length ? `<b>${memo.length}</b>` : ""}</button>`;
  bindOdds(v, race, od);
}

// フォーメーション: 着ごとに艇を選ぶと組番が並ぶ
function drawFormation(od, ents, types) {
  const t = types.includes(state.formType) ? state.formType : types[0];
  state.form = state.form || {};
  const f = state.form[t] = state.form[t] || { 1: [], 2: [], 3: [] };
  const cols = { "3t": [1, 2, 3], "2t": [1, 2], "3f": [1], "2f": [1], k: [1], "1t": [1], "1f": [1] }[t];
  const colName = cols.length > 1 ? cols.map((c) => `${c}着`) : ["選ぶ艇"];
  const B = [1, 2, 3, 4, 5, 6];
  const rows = B.map((b) => `<tr><td class="lk k${b}">${b}</td><td class="name">${esc(ents[b]?.name || "")}</td>${cols.map((c) =>
    `<td><button class="chk ${f[c].includes(b) ? "on" : ""}" data-fc="${c}" data-fb="${b}">✓</button></td>`).join("")}</tr>`).join("");
  const ctrl = `<tr><td></td><td class="name">すべて選択</td>${cols.map((c) => `<td><button class="chk2" data-fall="${c}">全</button></td>`).join("")}</tr>
    <tr><td></td><td class="name">すべて削除</td>${cols.map((c) => `<td><button class="chk2" data-fclr="${c}">削</button></td>`).join("")}</tr>`;
  // 組番を作る
  let combos = [];
  if (t === "3t") f[1].forEach((a) => f[2].forEach((b) => f[3].forEach((c) => { if (a !== b && b !== c && a !== c) combos.push(`${a}-${b}-${c}`); })));
  else if (t === "2t") f[1].forEach((a) => f[2].forEach((b) => { if (a !== b) combos.push(`${a}-${b}`); }));
  else if (t === "3f") { const s = [...f[1]].sort(); for (let i = 0; i < s.length; i++) for (let j = i + 1; j < s.length; j++) for (let k = j + 1; k < s.length; k++) combos.push(`${s[i]}=${s[j]}=${s[k]}`); }
  else if (t === "2f" || t === "k") { const s = [...f[1]].sort(); for (let i = 0; i < s.length; i++) for (let j = i + 1; j < s.length; j++) combos.push(`${s[i]}=${s[j]}`); }
  else combos = [...f[1]].sort().map(String);
  state.formCombos = { t, combos };
  const allIn = combos.length && combos.every((k) => memoHas(t, k));
  const bb = (b) => `<span class="mini k${b}">${b}</span>`;
  const list = combos.map((k) => `<tr class="oc ${memoHas(t, k) ? "osel" : ""}" data-t="${t}" data-k="${k}"><td>${k.split(/[-=]/).map(Number).map(bb).join(ORDERED[t] ? "-" : "=")}</td><td>${ofmt(od?.[t]?.[k])}</td></tr>`).join("");
  return `${types.length > 1 ? `<div class="seg">${types.map((x) => `<button class="pill2 ${x === t ? "on" : ""}" data-ft="${x}">${ONAME[x]}</button>`).join("")}</div>` : ""}
    <div class="tbl"><table class="otbl form"><thead><tr><th>枠</th><th>選手</th>${colName.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows}${ctrl}</tbody></table></div>
    <div class="orow"><h3 class="oh">組番一覧（${combos.length}点）</h3>
      ${combos.length ? `<button class="pill2" id="formAll">${allIn ? "✓ " + combos.length + "点すべての買い目を削除" : "○ " + combos.length + "点すべての買い目を選択"}</button>` : ""}</div>
    <div class="tbl"><table class="otbl rank"><thead><tr><th>組番</th><th>オッズ</th></tr></thead><tbody>${list || '<tr><td colspan="2" class="cnt">艇を選ぶと組番が出ます</td></tr>'}</tbody></table></div>`;
}

function bindOdds(v, race, od) {
  const redraw = () => drawOddsTab(v, race, true);
  document.querySelectorAll("[data-ot]").forEach((b) => b.onclick = () => { state.otype = b.dataset.ot; redraw(); });
  document.querySelectorAll("[data-ov]").forEach((b) => b.onclick = () => { state.oview = b.dataset.ov; redraw(); });
  const rl = $("oreload"); if (rl) rl.onclick = () => { rl.textContent = "読み込み中…"; redraw(); };
  document.querySelectorAll(".oc[data-k]").forEach((c) => c.onclick = () => {
    if (!od?.[c.dataset.t]?.[c.dataset.k] && c.tagName === "TD") return;
    memoToggle(c.dataset.t, c.dataset.k); redraw();
  });
  document.querySelectorAll("[data-ft]").forEach((b) => b.onclick = () => { state.formType = b.dataset.ft; redraw(); });
  const t = state.formCombos?.t;
  const f = t && state.form?.[t];
  document.querySelectorAll("[data-fc]").forEach((b) => b.onclick = () => {
    const c = b.dataset.fc, n = Number(b.dataset.fb);
    f[c] = f[c].includes(n) ? f[c].filter((x) => x !== n) : [...f[c], n]; redraw();
  });
  document.querySelectorAll("[data-fall]").forEach((b) => b.onclick = () => { f[b.dataset.fall] = [1, 2, 3, 4, 5, 6]; redraw(); });
  document.querySelectorAll("[data-fclr]").forEach((b) => b.onclick = () => { f[b.dataset.fclr] = []; redraw(); });
  const fa = $("formAll");
  if (fa) fa.onclick = () => {
    const { combos } = state.formCombos;
    const allIn = combos.every((k) => memoHas(t, k));
    combos.forEach((k) => memoToggle(t, k, !allIn)); redraw();
  };
  const fab = $("memofab"); if (fab) fab.onclick = () => openMemo(v, race, od);
}

// 買い目メモ: 合成オッズ・配分・想定払戻
function openMemo(v, race, od) {
  state.memoSort = state.memoSort || "boat";
  state.memoMode = state.memoMode || "pay";
  const list = memoLoad();
  const odd = (m) => olo(od?.[m.t]?.[m.k]);
  const withOdds = list.filter((m) => odd(m) > 0);
  const synth = withOdds.length ? 1 / withOdds.reduce((a, m) => a + 1 / odd(m), 0) : null;
  const total = list.reduce((a, m) => a + (m.amt || 0), 0);
  // 目安オッズ(=1÷出目確率)と、その合成(=1÷確率の合計)
  const pr = (m) => state.memoDm?.prob?.[DEME_KEY[m.t]]?.[demeKey(m.t, m.k)] ?? null;
  const psum = list.reduce((a, m) => a + (pr(m) || 0), 0);
  const fairSynth = psum > 0 ? 1 / psum : null;
  const sorted = [...list].sort((a, b) => state.memoSort === "odds" ? (odd(a) || 1e9) - (odd(b) || 1e9)
    : (a.t + a.k).localeCompare(b.t + b.k));
  const bb = (b) => `<span class="mini k${b}">${b}</span>`;
  const rows = sorted.map((m) => {
    const o = odd(m), pay = o ? Math.floor(o * m.amt) : null, pl = pay != null ? pay - total : null;
    const p = pr(m), fair = p ? 1 / p : null;
    return `<tr><td>${m.k.split(/[-=]/).map(Number).map(bb).join(ORDERED[m.t] ? "-" : "=")}<br><small class="cnt">${ONAME[m.t]}</small></td>
      <td>${ofmt(od?.[m.t]?.[m.k])}</td>
      <td class="${o && fair && o > fair ? "val" : ""}">${fair ? fair.toFixed(1) : "-"}<br><small class="cnt">${p ? (p * 100).toFixed(1) + "%" : ""}</small></td>
      <td><input class="amt" type="number" min="0" step="1" value="${(m.amt || 0) / 100}" data-t="${m.t}" data-k="${m.k}"><small>00円</small></td>
      <td class="payc">${pay != null ? pay.toLocaleString() + "円" : "-"}<br><small class="${pl >= 0 ? "plus" : "minus"}">${pl != null ? (pl >= 0 ? "+" : "") + pl.toLocaleString() + "円" : ""}</small></td>
      <td><button class="chk2" data-del="${m.t}|${m.k}">削</button></td></tr>`;
  }).join("");
  $("modal").hidden = false;
  $("sheet").innerHTML = `
    <button class="close" id="mclose">閉じる</button>
    <h2>買い目メモ <small style="color:var(--sub)">${esc(v.name)} ${race.no}R</small></h2>
    <div class="card" style="margin-top:10px">
      <div class="orow"><span>合成オッズ</span><b style="font-size:20px">${synth ? synth.toFixed(1) + "倍" : "-"}</b></div>
      <div class="orow"><span>目安オッズの合成 <small class="cnt">（的中確率 ${(psum * 100).toFixed(1)}%）</small></span>
        <b style="font-size:20px" class="${synth && fairSynth && synth > fairSynth ? "plus" : ""}">${fairSynth ? fairSynth.toFixed(1) + "倍" : "-"}</b></div>
      <div class="orow">
        <select id="mmode"><option value="pay" ${state.memoMode === "pay" ? "selected" : ""}>払戻が揃う配分</option><option value="even" ${state.memoMode === "even" ? "selected" : ""}>均等配分</option></select>
        <span><input id="mtotal" class="amt" type="number" min="0" value="${Math.max(total / 100, list.length)}"><small>00円</small></span>
        <button class="pill2 on" id="mapply">変更</button>
      </div>
      <div class="note">合計 ${total.toLocaleString()}円・${list.length}点。合成オッズは、全部の買い目を1つの賭けとみたときの倍率（払戻が揃う配分のとき）。目安オッズの合成は、出目確率から見た「これだけつけば五分」の倍率で、合成オッズの方が大きければ（緑）確率のわりに割に合う買い方です。</div>
    </div>
    <div class="orow"><div class="seg"><button class="pill2 ${state.memoSort === "boat" ? "on" : ""}" data-ms="boat">枠番順</button><button class="pill2 ${state.memoSort === "odds" ? "on" : ""}" data-ms="odds">オッズ順</button></div>
      <span class="cnt">${od?.time ? "オッズ " + esc(od.time) : "締切時オッズ"}</span></div>
    <div class="tbl"><table class="otbl memo"><thead><tr><th>組番</th><th>オッズ</th><th>目安オッズ<br><small>出目確率</small></th><th>購入金額</th><th>想定払戻<br>収支</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="cnt">オッズをタップすると、ここに入ります</td></tr>'}</tbody></table></div>
    ${list.length ? '<div style="text-align:center;margin-top:12px"><button class="pill2" id="mclear">すべての買い目を削除</button></div>' : ""}`;
  const re = () => openMemo(v, race, od);
  $("mclose").onclick = () => { closeModal(); drawOddsTab(v, race, true); };
  document.querySelectorAll("[data-ms]").forEach((b) => b.onclick = () => { state.memoSort = b.dataset.ms; re(); });
  $("mmode").onchange = (e) => { state.memoMode = e.target.value; };
  document.querySelectorAll("input.amt[data-k]").forEach((inp) => inp.onchange = () => {
    const l = memoLoad(); const m = l.find((x) => x.t === inp.dataset.t && x.k === inp.dataset.k);
    if (m) m.amt = Math.max(0, Math.round(Number(inp.value) || 0)) * 100;
    memoSave(l); re();
  });
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
    const [t, k] = b.dataset.del.split("|"); memoToggle(t, k, false); re();
  });
  const cl = $("mclear"); if (cl) cl.onclick = () => { memoSave([]); re(); };
  $("mapply").onclick = () => {
    const units = Math.max(0, Math.round(Number($("mtotal").value) || 0));
    const l = memoLoad();
    if (!l.length) return;
    if (state.memoMode === "even" || l.some((m) => !(odd(m) > 0))) {
      const base = Math.floor(units / l.length), rest = units - base * l.length;
      l.forEach((m, i) => { m.amt = (base + (i < rest ? 1 : 0)) * 100; });
    } else {
      // 1/オッズ に比例(どれが当たっても払戻がほぼ同じ)
      const w = l.map((m) => 1 / odd(m)), sw = w.reduce((a, b) => a + b, 0);
      const raw = w.map((x) => x / sw * units);
      const u = raw.map((x) => Math.max(1, Math.floor(x)));
      while (u.reduce((a, b) => a + b, 0) > units && Math.max(...u) > 1) u[u.indexOf(Math.max(...u))]--;
      let rest = units - u.reduce((a, b) => a + b, 0);
      raw.map((x, i) => [x - Math.floor(x), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rest > 0) { u[i]++; rest--; } });
      l.forEach((m, i) => { m.amt = u[i] * 100; });
    }
    memoSave(l); re();
  };
}

// ---------------------------------------------------------------- 共通
// 直前情報はサイトの公開を待たずに、リポジトリから直接読む(数分で反映)
const RAW = "https://raw.githubusercontent.com/suzuhaya5666-lgtm/boatdata/main/";
async function getBefore(hd, venue, no) {
  const path = `data/before/${hd}/${venue}_${String(no).padStart(2, "0")}.json`;
  try {
    const r = await fetch(RAW + path, { cache: "no-store" });
    if (r.ok) return await r.json();
  } catch (e) { /* 読めなければサイト側を見る */ }
  return getJSON(path).catch(() => null);
}
const cache = {};
async function cached(path) {
  if (!(path in cache)) {
    cache[path] = getJSON(path).catch(() => null);
  }
  return cache[path];
}
const loading = () => { $("view-race").innerHTML = '<div class="empty">読み込み中…</div>'; };
const pctv = (a, n) => n ? a / n * 100 : null;
const pcell = (a, n, cls = "") => n
  ? `<td class="${cls}"><span class="pv">${(a / n * 100).toFixed(1)}<small>%</small></span><br><small class="cnt">(${a}/${n}回)</small></td>`
  : `<td class="${cls}">-</td>`;
// 列ごとに1番を赤、2番を黄で塗る
function ranks(values) {
  const uniq = [...new Set(values.filter((x) => x != null && x > 0))].sort((a, b) => b - a);
  return values.map((x) => x == null || x <= 0 ? "" : x === uniq[0] ? "r1" : x === uniq[1] ? "r2" : "");
}
function lane(e) {
  return `<td class="lk k${e.boat}">${e.boat}</td>
    <td class="name"><span class="nm" data-reg="${e.regno || ""}" data-course="${e.boat}">${esc(e.name || "")}</span>
      ${e.class ? `<br><span class="cls ${e.class}">${e.class}</span>` : ""}</td>`;
}
const GRADE_BASE = [["all", "総合"], ["ippan", "一般戦"], ["g2g3", "G2・G3"], ["sgg1", "SG・G1"]];
const GRADE_OPTS = [...GRADE_BASE, ["women", "女子戦"]];
// 女子選手がいるときは「女子戦」を出し、一般戦は男女混合と分かる名前にする
function gradeOpts(female) {
  return female ? [["all", "総合"], ["ippan", "一般戦(男女混合)"], ["g2g3", "G2・G3"], ["sgg1", "SG・G1"], ["women", "女子戦"]] : GRADE_BASE;
}
state.g = "all";
function chipRow(id, opts, cur) {
  return `<div class="seg" id="${id}">${opts.map(([k, l]) => `<button data-p="${k}" class="pill2 ${k === cur ? "on" : ""}">${l}</button>`).join("")}</div>`;
}

// ---------------------------------------------------------------- 選手成績
async function drawRacerTab(v, race) {
  loading();
  const files = await Promise.all(race.entries.map((e) => cached(`data/stats/racers/${e.regno}.json`)));
  if (state.dtab !== "racer") return;
  state.rp = state.rp || "10";
  state.kp = state.kp || "6m";
  const pick = (r, period, c) => {
    if (!r || !r.bycourse) return null;
    if (period === "local") return r.bycourse.local?.[state.venue]?.[c] || null;
    const key = state.g !== "all" && (period === "6m" || period === "1y") ? `${period}_${state.g}` : period;
    return r.bycourse[key]?.[c] || null;
  };
  const anyFemale = files.some((f) => f?.female);
  const gopts = gradeOpts(anyFemale);
  if (!gopts.some((o) => o[0] === state.g)) state.g = "all";
  const gNote = state.g !== "all" ? `<div class="note">グレードの切り替えは、直近6ヶ月と直近1年に効きます。</div>` : "";
  // 枠別着率(枠番=コースとして、その選手がそのコースで走ったときの成績)
  const rows = race.entries.map((e, i) => ({ e, b: pick(files[i], state.rp, String(e.boat)) }));
  const cols = [
    (b) => b ? [b.p1 + b.p2 + b.p3, b.n] : null,
    (b) => b ? [b.p1, b.n] : null,
    (b) => b ? [b.p2, b.n] : null,
    (b) => b ? [b.p3, b.n] : null,
  ];
  const rk = cols.map((f) => ranks(rows.map(({ b }) => { const x = f(b); return x ? pctv(x[0], x[1]) : null; })));
  const t1 = rows.map(({ e, b }, i) => `<tr>${lane(e)}${cols.map((f, j) => { const x = f(b); return x ? pcell(x[0], x[1], rk[j][i]) : "<td>-</td>"; }).join("")}</tr>`).join("");

  // 決まり手
  const krow = race.entries.map((e, i) => {
    const b = pick(files[i], state.kp, String(e.boat));
    return { e, b };
  });
  const keys1 = [["win", "逃げ", "逃げ"], ["lost", "差し", "差され"], ["lost", "まくり", "まくられ"], ["lost", "まくり差し", "まくられ差"]];
  const keysN = [["nigashi", null, "逃し"], ["win", "差し", "差し"], ["win", "まくり", "まくり"], ["win", "まくり差し", "まくり差し"]];
  const val = (b, [grp, k]) => {
    if (!b) return null;
    if (grp === "nigashi") return [b.nigashi || 0, b.n];
    return [b[grp]?.[k] || 0, b.n];
  };
  const one = krow[0];
  const t2a = `<tr>${lane(one.e)}${keys1.map((k, j) => {
    const x = val(one.b, k);
    return x ? pcell(x[0], x[1], j > 0 && x[0] ? "bad" : "") : "<td>-</td>";
  }).join("")}</tr>`;
  const others = krow.slice(1);
  const rk2 = keysN.map((k) => ranks(others.map(({ b }) => { const x = val(b, k); return x ? pctv(x[0], x[1]) : null; })));
  const t2b = others.map(({ e, b }, i) => `<tr>${lane(e)}${keysN.map((k, j) => {
    if (j === 0 && e.boat !== 2) return "<td>-</td>";
    const x = val(b, k);
    return x ? pcell(x[0], x[1], j === 0 ? "" : rk2[j][i]) : "<td>-</td>";
  }).join("")}</tr>`).join("");

  $("view-race").innerHTML = `
    <div class="card">
      <h2>枠別着率</h2>
      ${chipRow("rg", gopts, state.g)}
      ${chipRow("rp", [["10", "直近10走"], ["6m", "直近6ヶ月"], ["1y", "直近1年"], ["local", "当地"]], state.rp)}${gNote}
      <div class="tbl"><table class="cmp"><thead><tr><th>枠</th><th>選手</th><th>3連対率</th><th>1着率</th><th>2着率</th><th>3着率</th></tr></thead>
        <tbody>${t1}</tbody></table></div>
      <div class="note">それぞれの選手が、この枠と同じコースで走ったときの成績です（直近10走はそのコースでの直近10回）。当地は${esc(v.name)}での直近1年。</div>
    </div>
    <div class="card">
      <h2>決まり手率</h2>
      ${chipRow("kg", gopts, state.g)}
      ${chipRow("kp", [["6m", "直近6ヶ月"], ["1y", "直近1年"]], state.kp)}
      <div class="tbl"><table class="cmp"><thead><tr><th>枠</th><th>選手</th><th>逃げ</th><th>差され</th><th>まくられ</th><th>まくられ差</th></tr></thead>
        <tbody>${t2a}</tbody></table></div>
      <div class="tbl"><table class="cmp"><thead><tr><th>枠</th><th>選手</th><th>逃し</th><th>差し</th><th>まくり</th><th>まくり差し</th></tr></thead>
        <tbody>${t2b}</tbody></table></div>
      <div class="note">1号艇は1コースで走ったとき、逃げ切った率と、差し・まくり・まくり差しで負けた率。2〜6号艇はそのコースで、差し・まくり・まくり差しで勝った率。逃しは2コースで1コースに逃げられた率。</div>
    </div>`;
  ["rg", "kg"].forEach((id) => $(id).querySelectorAll("button").forEach((b) => b.onclick = () => { state.g = b.dataset.p; drawRacerTab(v, race); }));
  $("rp").querySelectorAll("button").forEach((b) => b.onclick = () => { state.rp = b.dataset.p; drawRacerTab(v, race); });
  $("kp").querySelectorAll("button").forEach((b) => b.onclick = () => { state.kp = b.dataset.p; drawRacerTab(v, race); });
}
