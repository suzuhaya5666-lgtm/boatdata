// ---------------------------------------------------------------- 出目確率
// 重み W[着][対象コース][情報源] (情報源 0=自艇, c=コースcの選手から見た値) で
// 各艇の1〜3着確率を出し、3連単120通りに組み立てる。
const ZERO = { n: 0, p1: 0, p2: 0, p3: 0 };
function demeQ(order, racers, vstat, model) {
  const m = model.m;
  const prior = {};
  for (let k = 1; k <= 6; k++) {
    const c = vstat.course[k];
    prior[k] = [1, 2, 3].map((j) => (c[`p${j}`] + 1) / (c.n + 6));
  }
  const rate = (x, k, j) => (x[`p${j + 1}`] + m * prior[k][j]) / (x.n + m);
  const q = {};
  for (let k = 1; k <= 6; k++) q[k] = [0, 0, 0];
  for (let j = 0; j < 3; j++) {
    for (let k = 1; k <= 6; k++) {
      const me = racers[order[k]]?.sheet?.all;
      let v = model.W[j][k][0] * rate(me?.course?.[k] || ZERO, k, j);
      for (let c = 1; c <= 6; c++) {
        if (c === k) continue;
        const o = racers[order[c]]?.sheet?.all?.others?.[c]?.[k] || ZERO;
        v += model.W[j][k][c] * rate(o, k, j);
      }
      q[k][j] = Math.max(v, 1e-6);
    }
    const s = [1, 2, 3, 4, 5, 6].reduce((a, k) => a + q[k][j], 0);
    for (let k = 1; k <= 6; k++) q[k][j] /= s;
  }
  return q;
}
// 材料(展示タイム・勝率・モーター・級別・平均ST)を係数で足す
const CLS_NUM = { A1: 4, A2: 3, B1: 2, B2: 1 };
function demeAdjust(q, order, ents, racers, bi, model) {
  if (!model.coef) return { q, used: [] };
  // 選んだ材料の組み合わせで決め直した係数を使う
  const nf = model.features.length;
  const mask = state.featMask ?? ((1 << (nf + 1)) - 1);
  const combo = model.combos?.[mask] || { coef: model.coef, cbias: model.cbias };
  model = { ...model, coef: combo.coef, cbias: combo.cbias };
  const val = (f, b) => {
    const e = ents[b] || {};
    if (f === "exh") return bi?.entries?.[b]?.exh ?? e.exh ?? null;
    if (f === "class") return CLS_NUM[e.class] ?? null;
    if (f === "avg_st") return racers[b]?.sheet?.all?.st?.total?.avg ?? null;
    return e[f] ?? null;
  };
  const used = [];
  const Z = {};
  for (let k = 1; k <= 6; k++) Z[k] = [];
  model.features.forEach((f, i) => {
    const raw = [1, 2, 3, 4, 5, 6].map((k) => val(f, order[k]));
    const have = raw.filter((x) => x != null && !Number.isNaN(x));
    if (have.length && (mask >> i & 1)) used.push(model.feature_names[i]);
    const mean = have.length ? have.reduce((a, b) => a + b, 0) / have.length : 0;
    [1, 2, 3, 4, 5, 6].forEach((k, n) => { Z[k][i] = ((raw[n] ?? mean) - mean) / model.sd[i]; });
  });
  const out = {};
  for (let k = 1; k <= 6; k++) out[k] = [0, 0, 0];
  for (let j = 0; j < 3; j++) {
    const c = model.coef[j];
    const cb = model.cbias ? model.cbias[j] : [0, 0, 0, 0, 0, 0, 0];
    const sc = [1, 2, 3, 4, 5, 6].map((k) => c[0] * Math.log(q[k][j]) + Z[k].reduce((a, z, i) => a + c[i + 1] * z, 0) + cb[k]);
    const mx = Math.max(...sc);
    const ex = sc.map((x) => Math.exp(x - mx));
    const sum = ex.reduce((a, b) => a + b, 0);
    [1, 2, 3, 4, 5, 6].forEach((k, n) => { out[k][j] = ex[n] / sum; });
  }
  if (mask >> nf & 1) used.push("コース補正");
  return { q: out, used, ev: combo.eval };
}
function demeTri(q) {
  const out = [];
  for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) for (let c = 1; c <= 6; c++) {
    if (a === b || b === c || a === c) continue;
    const p = q[a][0] * q[b][1] / (1 - q[a][1]) * q[c][2] / (1 - q[a][2] - q[b][2]);
    out.push({ c: [a, b, c], p });
  }
  const s = out.reduce((x, y) => x + y.p, 0);
  out.forEach((o) => { o.p /= s; });
  return out.sort((x, y) => y.p - x.p);
}
function sumBy(tri, keyFn) {
  const m = new Map();
  tri.forEach((t) => { const k = keyFn(t.c); m.set(k, (m.get(k) || 0) + t.p); });
  return [...m.entries()].map(([k, p]) => ({ k, p })).sort((a, b) => b.p - a.p);
}

// 出目確率タブと同じ設定(進入・材料)で、艇番ベースの確率を出す
async function computeDeme(race) {
  const hd = state.date.replace(/-/g, "");
  const [model, vs, bi, ...files] = await Promise.all([
    cached("data/model/weights.json"), cached("data/stats/venues.json"),
    getBefore(hd, state.venue, race.no),
    ...race.entries.map((e) => cached(`data/stats/racers/${e.regno}.json`))]);
  if (!model || !vs) return null;
  const racers = Object.fromEntries(race.entries.map((e, i) => [e.boat, files[i]]));
  const ents = Object.fromEntries(race.entries.map((e) => [e.boat, e]));
  let base = [0, 1, 2, 3, 4, 5, 6];
  if (bi?.start?.length === 6) base = [0, ...bi.start.map((s) => s.boat)];
  const order = state.orders?.[`${state.date}_${state.venue}_${race.no}`] || base;
  const adj = demeAdjust(demeQ(order, racers, vs.venues[state.venue].all, model), order, ents, racers, bi, model);
  const tri = demeTri(adj.q).map((t) => ({ b: t.c.map((c) => order[c]), p: t.p }));
  const prob = {};  // 券種 -> {組番: 確率}
  const add = (bet, k, p) => { (prob[bet] = prob[bet] || {})[k] = (prob[bet][k] || 0) + p; };
  tri.forEach(({ b, p }) => {
    add("単勝", `${b[0]}`, p);
    add("複勝", `${b[0]}`, p); add("複勝", `${b[1]}`, p);  // 複勝は2着以内
    add("2連単", `${b[0]}-${b[1]}`, p);
    add("2連複", [b[0], b[1]].sort().join("-"), p);
    [[b[0], b[1]], [b[0], b[2]], [b[1], b[2]]].forEach((x) => add("拡連複", x.sort().join("-"), p));
    add("3連単", b.join("-"), p);
    add("3連複", [...b].sort().join("-"), p);
  });
  const rank = {};
  Object.entries(prob).forEach(([bet, m]) => {
    const sorted = Object.entries(m).sort((x, y) => y[1] - x[1]).map((x) => x[0]);
    rank[bet] = Object.fromEntries(sorted.map((k, i) => [k, i + 1]));
    rank[bet]._n = sorted.length;
  });
  return { prob, rank, exh: !!bi?.start?.length };
}

async function drawDemeTab(v, race) {
  loading();
  const hd = state.date.replace(/-/g, "");
  const [model, vs, bi, ...files] = await Promise.all([
    cached("data/model/weights.json"), cached("data/stats/venues.json"),
    getBefore(hd, state.venue, race.no),
    ...race.entries.map((e) => cached(`data/stats/racers/${e.regno}.json`))]);
  if (state.dtab !== "deme") return;
  if (!model || !vs) { $("view-race").innerHTML = '<div class="empty">出目確率のデータがまだありません。</div>'; return; }
  const racers = Object.fromEntries(race.entries.map((e, i) => [e.boat, files[i]]));
  const ents = Object.fromEntries(race.entries.map((e) => [e.boat, e]));

  // 進入: 展示進入 → なければ枠なり。手で入れ替えたものは レースごとに覚える
  const key = `${state.date}_${state.venue}_${race.no}`;
  let base = [0, 1, 2, 3, 4, 5, 6], baseLabel = "枠なり（展示前）";
  if (bi?.start?.length === 6) { base = [0, ...bi.start.map((s) => s.boat)]; baseLabel = "スタート展示の進入"; }
  state.orders = state.orders || {};
  const order = state.orders[key] || base;
  const custom = !!state.orders[key];

  const adj = demeAdjust(demeQ(order, racers, vs.venues[state.venue].all, model), order, ents, racers, bi, model);
  const q = adj.q;
  const hasExh = adj.used.includes("展示タイム");
  const boatOf = (c) => order[c];
  // 切る艇: その艇が3着以内に来ない前提で、残りの組み合わせだけで確率を出し直す
  state.cuts = state.cuts || {};
  const cut = new Set(state.cuts[key] || []);
  const triAll = demeTri(q);
  let tri = triAll, keep = 1;
  if (cut.size) {
    tri = triAll.filter((t) => !t.c.some((c) => cut.has(boatOf(c))));
    keep = tri.reduce((a, t) => a + t.p, 0);
    tri = tri.map((t) => ({ ...t, p: t.p / keep }));
  }
  // 表に出す各着の確率は、120通りを足し合わせた本当の確率(コース別)
  const marg = {};
  for (let k = 1; k <= 6; k++) marg[k] = [0, 0, 0];
  tri.forEach((t) => t.c.forEach((k, j) => { marg[k][j] += t.p; }));
  const done = race.entries.some((e) => e.place === 1);
  const res = done ? [1, 2, 3].map((p) => race.entries.find((e) => e.place === p)?.boat) : null;
  const bb = (b) => `<span class="mini k${b}">${b}</span>`;
  const isHit = (boats) => res && boats.every((b, i) => b === res[i]);

  // 各艇の確率表(コース順)
  const cols = [0, 1, 2].map((j) => ranks([1, 2, 3, 4, 5, 6].map((c) => cut.has(boatOf(c)) ? -1 : marg[c][j])));
  const rows = [1, 2, 3, 4, 5, 6].map((c, i) => {
    const e = ents[boatOf(c)];
    if (cut.has(e.boat)) return `<tr class="cutrow"><td>${c}</td>${lane(e)}<td colspan="5">切り</td></tr>`;
    return `<tr><td class="${c !== e.boat ? "moved" : ""}">${c}</td>${lane(e)}
      ${[0, 1, 2].map((j) => `<td class="${cols[j][i]}">${(marg[c][j] * 100).toFixed(1)}%</td>`).join("")}
      <td>${((marg[c][0] + marg[c][1]) * 100).toFixed(1)}%</td><td>${((marg[c][0] + marg[c][1] + marg[c][2]) * 100).toFixed(1)}%</td></tr>`;
  }).join("");

  // 3連単(艇番で表示)
  const triB = tri.map((t) => ({ b: t.c.map(boatOf), p: t.p }));
  const hitRank = res ? triB.findIndex((t) => isHit(t.b)) : -1;
  const list = (items, n, fmtKey) => items.slice(0, n).map((t, i) => `
    <tr class="${t.hit ? "hit" : ""}"><td>${i + 1}</td><td class="combo">${fmtKey(t)}</td>
      <td>${(t.p * 100).toFixed(1)}%</td><td>${(1 / t.p).toFixed(1)}倍</td></tr>`).join("");
  const triRows = list(triB.map((t) => ({ ...t, hit: isHit(t.b) })), 20, (t) => t.b.map(bb).join("-"));
  const exa = sumBy(triB.map((t) => ({ c: t.b, p: t.p })), (c) => `${c[0]}-${c[1]}`)
    .map((x) => ({ ...x, hit: res && x.k === `${res[0]}-${res[1]}` }));
  const trio = sumBy(triB.map((t) => ({ c: t.b, p: t.p })), (c) => [...c].sort().join("="))
    .map((x) => ({ ...x, hit: res && x.k === [...res].sort().join("=") }));
  const quin = sumBy(triB.map((t) => ({ c: t.b, p: t.p })), (c) => [c[0], c[1]].sort().join("="))
    .map((x) => ({ ...x, hit: res && x.k === [res[0], res[1]].sort().join("=") }));
  const keyFmt = (sep) => (t) => t.k.split(sep).map(Number).map(bb).join(sep === "=" ? "=" : "-");

  // 進入の入れ替え
  const slots = [1, 2, 3, 4, 5, 6].map((c) =>
    `<button class="slot ${state.pick === c ? "on" : ""}" data-slot="${c}"><small>${c}コース</small>${bb(boatOf(c))}</button>`).join("");

  $("view-race").innerHTML = `
    <div class="card">
      <h2>進入</h2>
      <div class="slots">${slots}</div>
      <div class="note">${custom ? "手で入れ替えた進入で計算しています。" : `${baseLabel}で計算しています。`}
        入れ替えたい2つの枠を順にタップすると入れ替わります。</div>
      ${custom ? '<button class="pill2" id="resetOrder" style="margin-top:8px">' + (bi?.start?.length === 6 ? "展示進入" : "枠なり") + "に戻す</button>" : ""}
    </div>
    ${featCard(model, adj)}
    <div class="card">
      <h2>切る艇</h2>
      <div class="slots">${[1, 2, 3, 4, 5, 6].map((b) => `<button class="slot cutbtn ${cut.has(b) ? "on" : ""}" data-cut="${b}"><small>${cut.has(b) ? "切り" : "&nbsp;"}</small>${bb(b)}</button>`).join("")}</div>
      <div class="note">${cut.size
        ? `${[...cut].sort().map(bb).join("・")} が3着以内に来ない前提で、残りの組み合わせだけで確率を出し直しています。この前提になる確率（切った艇がどれも3着以内に来ない確率）は <b>${(keep * 100).toFixed(1)}%</b>。`
        : "3着以内に来ないと思う艇をタップすると、その艇を除いた確率に出し直します（3艇まで）。"}</div>
      ${cut.size ? '<button class="pill2" id="resetCut" style="margin-top:8px">切りをすべて解除</button>' : ""}
    </div>
    <div class="card">
      <h2>各艇の着順確率</h2>
      <div class="meta"><span>${hasExh ? "展示タイム込み" : "展示タイムなし（展示前）"}</span><span>材料: コース別成績・${adj.used.join("・")}</span></div>
      <div class="tbl"><table class="cmp"><thead><tr><th>コース</th><th>枠</th><th>選手</th><th>1着</th><th>2着</th><th>3着</th><th>2連対</th><th>3連対</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
    <div class="card">
      <h2>3連単 上位20点</h2>
      ${res ? `<div class="meta"><span>${hitRank >= 0 ? `結果 ${res.map(bb).join("-")} は ${hitRank + 1}番目（${(triB[hitRank].p * 100).toFixed(1)}%）` : `結果 ${res.map(bb).join("-")} には切った艇が入っています`}</span></div>` : ""}
      <div class="tbl"><table class="cmp"><thead><tr><th>順</th><th>買い目</th><th>確率</th><th>目安オッズ</th></tr></thead>
        <tbody>${triRows}</tbody></table></div>
      <div class="note">目安オッズは 1÷確率。実際のオッズがこれより高ければ、確率の上では割に合う買い目です。上位20点の合計 ${(triB.slice(0, 20).reduce((a, t) => a + t.p, 0) * 100).toFixed(1)}%。</div>
    </div>
    <div class="card"><h2>2連単 上位10点</h2>
      <div class="tbl"><table class="cmp"><thead><tr><th>順</th><th>買い目</th><th>確率</th><th>目安オッズ</th></tr></thead>
        <tbody>${list(exa, 10, keyFmt("-"))}</tbody></table></div></div>
    <div class="card"><h2>3連複 上位10点</h2>
      <div class="tbl"><table class="cmp"><thead><tr><th>順</th><th>買い目</th><th>確率</th><th>目安オッズ</th></tr></thead>
        <tbody>${list(trio, 10, keyFmt("="))}</tbody></table></div></div>
    <div class="card"><h2>2連複 上位6点</h2>
      <div class="tbl"><table class="cmp"><thead><tr><th>順</th><th>買い目</th><th>確率</th><th>目安オッズ</th></tr></thead>
        <tbody>${list(quin, 6, keyFmt("="))}</tbody></table></div></div>
    <div class="card"><h2>計算のしかた</h2>
      <div class="note" style="font-size:13px;line-height:1.7">
        各艇の1〜3着確率は、<b>自艇の成績</b>（その選手がそのコースで走ったときの着率）と、<b>他艇から見た成績</b>（ほかの選手のレースで、そのコースの艇が何着だったか）を、着ごと・コースごとに決めた重みで混ぜています。
        走った回数が少ない成績は、${esc(v.name)}のコース別平均に${model.m}走分寄せています。
        重みは過去${model.races.toLocaleString()}レース（${model.from}〜${model.to}）で、実際の着順に一番合うように毎月作り直しています。</div>
      <div class="note" style="font-size:13px;line-height:1.7;margin-top:8px">
        そのうえで、${(model.feature_names || []).join("・")}をレース内で比べた差を、着ごとの係数で足しています（係数も毎月作り直し）。展示前は展示タイムを使わずに計算し、展示が取れたら自動で入ります。</div>
      ${coefTable({ ...model, ...(model.combos?.[state.featMask ?? ((1 << (model.features.length + 1)) - 1)] || {}) })}
      <div class="tbl">${weightTable(model)}</div>
    </div>`;

  $("view-race").querySelectorAll("[data-slot]").forEach((b) => b.onclick = () => {
    const c = Number(b.dataset.slot);
    if (!state.pick) { state.pick = c; }
    else {
      if (state.pick !== c) {
        const o = [...order];
        [o[state.pick], o[c]] = [o[c], o[state.pick]];
        state.orders[key] = o.join() === base.join() ? undefined : o;
        if (!state.orders[key]) delete state.orders[key];
      }
      state.pick = null;
    }
    drawDemeTab(v, race);
  });
  document.querySelectorAll("#feats [data-f]").forEach((b) => b.onclick = () => {
    const nf = model.features.length;
    const cur = state.featMask ?? ((1 << (nf + 1)) - 1);
    state.featMask = cur ^ (1 << Number(b.dataset.f));
    drawDemeTab(v, race);
  });
  const fa = $("featAll");
  if (fa) fa.onclick = () => { state.featMask = null; drawDemeTab(v, race); };
  $("view-race").querySelectorAll("[data-cut]").forEach((b) => b.onclick = () => {
    const n = Number(b.dataset.cut);
    if (cut.has(n)) cut.delete(n); else if (cut.size < 3) cut.add(n);
    if (cut.size) state.cuts[key] = [...cut]; else delete state.cuts[key];
    drawDemeTab(v, race);
  });
  const rc = $("resetCut");
  if (rc) rc.onclick = () => { delete state.cuts[key]; drawDemeTab(v, race); };
  const rb = $("resetOrder");
  if (rb) rb.onclick = () => { delete state.orders[key]; state.pick = null; drawDemeTab(v, race); };
}

function featCard(model, adj) {
  if (!model.combos) return "";
  const nf = model.features.length;
  const all = (1 << (nf + 1)) - 1;
  const mask = state.featMask ?? all;
  const names = [...model.feature_names, "コース補正"];
  const chips = names.map((nm, i) => `<button class="pill2 ${mask >> i & 1 ? "on" : ""}" data-f="${i}">${nm}</button>`).join("");
  const ev = adj.ev;
  const best = model.combos[all].eval;
  return `<div class="card"><h2>計算に使う材料</h2>
    <div class="seg" id="feats">${chips}</div>
    ${ev ? `<div class="meta"><span>この組み合わせの検証（過去${model.eval_races.toLocaleString()}レース）:</span>
      <span>3連単上位10点 <b>${ev.tri10}%</b></span><span>2連単上位3点 <b>${ev.ex3}%</b></span><span>単勝 <b>${ev.tan}%</b></span></div>` : ""}
    <div class="note">コース別成績（自艇・他艇）はいつも使います。材料を外すと、残りの材料の係数を決め直したもので計算します。
      ${mask !== all ? `全部使うと 3連単上位10点 ${best.tri10}%。<button class="pill2" id="featAll" style="margin-left:6px">全部に戻す</button>` : "今は全部使っています（いちばん当たる組み合わせ）。"}</div>
  </div>`;
}
function coefTable(model) {
  if (!model.coef) return "";
  const rows = model.feature_names.map((nm, i) => `<tr><td style="text-align:left">${nm}</td>${[0, 1, 2].map((j) => {
    const c = model.coef[j][i + 1];
    const w = Math.min(Math.abs(c) / 0.45, 1);
    return `<td style="background:rgba(${c < 0 ? "21,101,192" : "232,89,12"},${w * 0.5})">${c > 0 ? "+" : ""}${c.toFixed(2)}</td>`;
  }).join("")}</tr>`).join("");
  return `<div class="tbl"><table class="wt"><thead><tr><th>材料</th><th>1着</th><th>2着</th><th>3着</th></tr></thead><tbody>
    <tr><td style="text-align:left">コース別成績の確率</td>${[0, 1, 2].map((j) => `<td>${model.coef[j][0].toFixed(2)}</td>`).join("")}</tr>${rows}
    ${model.cbias ? [1, 2, 3, 4, 5, 6].map((k) => `<tr><td style="text-align:left">${k}コースの補正</td>${[0, 1, 2].map((j) => {
      const c = model.cbias[j][k];
      return `<td style="background:rgba(${c < 0 ? "21,101,192" : "232,89,12"},${Math.min(Math.abs(c) / 0.9, 1) * 0.5})">${c > 0 ? "+" : ""}${c.toFixed(2)}</td>`;
    }).join("")}</tr>`).join("") : ""}</tbody></table></div>
    <div class="note">材料の数字は、レース内で平均より1目盛り(標準的なばらつき)上のときの効き。＋は上の着に来やすく、−は来にくい。展示タイムと平均STは小さいほど良いので−が「効いている」向きです。</div>`;
}
function weightTable(model) {
  const head = ["自艇", "1コース", "2コース", "3コース", "4コース", "5コース", "6コース"];
  return [0, 1, 2].map((j) => `
    <div style="margin-top:10px;font-weight:700">${j + 1}着確率の重み</div>
    <table class="wt"><thead><tr><th>対象</th>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${[1, 2, 3, 4, 5, 6].map((k) => `<tr><td>${k}コース</td>${[0, 1, 2, 3, 4, 5, 6].map((s) => {
      const w = model.W[j][k][s];
      return s === k ? '<td class="na">—</td>' : `<td style="background:rgba(21,101,192,${Math.min(w, 1) * 0.55})">${w >= 0.005 ? Math.round(w * 100) : ""}</td>`;
    }).join("")}</tr>`).join("")}
    </tbody></table>`).join("") + '<div class="note">数字は%。行のコースの艇の確率を出すとき、どこからの情報をどれだけ使っているか。</div>';
}

// ---------------------------------------------------------------- モーター成績
async function drawMotorTab(v, race) {
  loading();
  const ms = await cached("data/stats/motors.json");
  if (state.dtab !== "motor") return;
  const mv = ms?.venues?.[state.venue];
  if (!mv) { $("view-race").innerHTML = '<div class="empty">モーターの集計がまだありません。</div>'; return; }
  state.mp = state.mp || "all";
  const all = Object.entries(mv.motors).map(([no, p]) => ({ no: Number(no), s: p[state.mp] }))
    .filter((m) => m.s && m.s.n > 0)
    .map((m) => ({ ...m, win: m.s.pts / m.s.n, r2: (m.s.p1 + m.s.p2) / m.s.n * 100, r3: (m.s.p1 + m.s.p2 + m.s.p3) / m.s.n * 100 }));
  const rankBy = (key) => {
    const s = [...all].sort((a, b) => b[key] - a[key]);
    return Object.fromEntries(s.map((m, i) => [m.no, i + 1]));
  };
  const rWin = rankBy("win"), r2 = rankBy("r2");
  const total = all.length;
  const mine = race.entries.map((e) => ({ e, m: all.find((x) => x.no === e.motor_no) }));
  const winRk = ranks(mine.map(({ m }) => m ? m.win : null));
  const r2Rk = ranks(mine.map(({ m }) => m ? m.r2 : null));
  const rows = mine.map(({ e, m }, i) => `<tr>${lane(e)}
    <td>${e.motor_no ?? "-"}</td>
    <td class="${winRk[i]}">${m ? m.win.toFixed(2) : "-"}${m ? `<br><small class="cnt">${rWin[m.no]}位/${total}機</small>` : ""}</td>
    <td class="${r2Rk[i]}">${m ? m.r2.toFixed(1) + "%" : "-"}${m ? `<br><small class="cnt">${r2[m.no]}位/${total}機</small>` : ""}</td>
    <td>${m ? m.r3.toFixed(1) + "%" : "-"}</td>
    <td>${m ? m.s.n : "-"}</td>
    <td>${e.motor_2 != null ? e.motor_2.toFixed(1) + "%" : "-"}</td></tr>`).join("");
  const here = new Set(race.entries.map((e) => e.motor_no));
  const top = [...all].sort((a, b) => b.win - a.win).map((m, i) => `
    <tr class="${here.has(m.no) ? "own" : ""}"><td>${i + 1}</td><td>${m.no}</td><td>${m.win.toFixed(2)}</td>
      <td>${m.r2.toFixed(1)}%</td><td>${m.r3.toFixed(1)}%</td><td>${m.s.n}</td></tr>`).join("");
  $("view-race").innerHTML = `
    <div class="card">
      <h2>モーター成績</h2>
      ${chipRow("mp", [["1m", "直近1ヶ月"], ["3m", "直近3ヶ月"], ["6m", "直近6ヶ月"], ["all", "全て"]], state.mp)}
      <div class="tbl"><table class="cmp"><thead><tr><th>枠</th><th>選手</th><th>No</th><th>勝率<br><small>場内順位</small></th>
        <th>2連対率<br><small>場内順位</small></th><th>3連対率</th><th>出走</th><th>公式<br>2連率</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="note">今のモーターの使い始め（${esc(mv.start)}）からの成績です。「全て」はその期間すべて。勝率は1着10点・2着8点・3着6点・4着4点・5着2点・6着1点の平均。公式2連率は出走表の値です。</div>
    </div>
    <div class="card">
      <h2>${esc(v.name)} モーター勝率ランキング</h2>
      <div class="tbl" style="max-height:420px;overflow-y:auto"><table><thead><tr><th>順位</th><th>No</th><th>勝率</th><th>2連対率</th><th>3連対率</th><th>出走</th></tr></thead>
        <tbody>${top}</tbody></table></div>
      <div class="note">このレースで使うモーターを色付きで表示しています。</div>
    </div>`;
  $("mp").querySelectorAll("button").forEach((b) => b.onclick = () => { state.mp = b.dataset.p; drawMotorTab(v, race); });
}

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.view === "race" && state.tab === "race") { go("home"); return; }
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
  state.tab = b.dataset.view;
  $("view-race").hidden = state.tab !== "race";
  $("view-venue").hidden = state.tab !== "venue";
  $("view-bets").hidden = state.tab !== "bets";
  draw();
  if (state.tab === "venue") renderVenue();
}));

// ---------------------------------------------------------------- 集計データ
const pct = (a, n) => n ? (a / n * 100).toFixed(1) + "%" : "-";
let venueStats = null;
async function getVenueStats() {
  if (!venueStats) venueStats = await getJSON("data/stats/venues.json");
  return venueStats;
}

async function renderVenue() {
  const box = $("view-venue");
  let vs;
  try { vs = await getVenueStats(); } catch (e) {
    box.innerHTML = '<div class="empty">集計データがまだありません。</div>'; return;
  }
  const code = state.venue && vs.venues[state.venue] ? state.venue : Object.keys(vs.venues)[0];
  const vv = vs.venues[code];
  const v = { name: vv.name, ...(vv[state.g] || vv.all) };
  const gName = GRADE_OPTS.find((x) => x[0] === state.g)?.[1] || "総合";
  const seg = Object.entries(vs.venues).map(([c, x]) =>
    `<button data-sv="${c}" class="${c === code ? "on" : ""}">${esc(x.name)}</button>`).join("");
  const crow = [1, 2, 3, 4, 5, 6].map((c) => {
    const x = v.course[c];
    const km = Object.entries(v.kimarite[c] || {}).sort((a, b) => b[1] - a[1]).slice(0, 2)
      .map(([k, n]) => `${esc(k)}${n}`).join(" ");
    return `<tr><td><span class="waku w${c}">${c}</span></td><td>${x.n}</td><td>${x.p1}</td><td>${x.p2}</td><td>${x.p3}</td>
      <td class="${c === 1 ? "hi" : ""}">${pct(x.p1, x.n)}</td><td>${pct(x.p1 + x.p2, x.n)}</td><td>${pct(x.p1 + x.p2 + x.p3, x.n)}</td>
      <td style="text-align:left">${km}</td></tr>`;
  }).join("");
  const rrow = Object.entries(v.race).map(([no, r]) => `
    <tr><td>${no}R</td><td>${r.n}</td>
      ${[1, 2, 3, 4, 5, 6].map((c) => `<td class="${c === 1 ? "hi" : ""}">${pct(r.course_win[c], r.n)}</td>`).join("")}
      <td>${r.tri_avg ? r.tri_avg.toLocaleString() : "-"}</td><td>${r.tri_median ? r.tri_median.toLocaleString() : "-"}</td>
      <td>${r.man_rate ?? "-"}%</td><td>${r.fav_rate ?? "-"}%</td></tr>`).join("");
  box.innerHTML = `
    <div class="seg">${seg}</div>
    ${chipRow("vg", GRADE_OPTS, state.g)}
    <div class="card"><h2>${esc(v.name)} コース別成績</h2>
      <div class="meta"><span>${vs.period.from}〜${vs.period.to}</span><span>${gName}（${v.course["1"].n}レース）</span></div>
      <div class="tbl"><table><thead><tr><th>コース</th><th>出走</th><th>1着</th><th>2着</th><th>3着</th>
        <th>1着率</th><th>2連対率</th><th>3連対率</th><th>主な決まり手</th></tr></thead><tbody>${crow}</tbody></table></div>
    </div>
    <div class="card"><h2>${esc(v.name)} レース別成績</h2>
      <div class="tbl"><table><thead><tr><th>R</th><th>数</th>
        ${[1, 2, 3, 4, 5, 6].map((c) => `<th>${c}コース<br>1着率</th>`).join("")}
        <th>3連単<br>平均</th><th>3連単<br>中央値</th><th>万舟率</th><th>1番人気<br>決着率</th></tr></thead>
        <tbody>${rrow}</tbody></table></div>
      <div class="note">平均は高配当に引っぱられるので、ふだんの配当の目安は中央値を見てください。</div>
    </div>
    ${vs.st34 ? `<div class="card"><h2>3・4コースの平均ST差と各コースの成績</h2>
      <div class="note" style="margin-bottom:6px">差＝3コースの選手の平均ST − 4コースの選手の平均ST（どちらもそのコースでの、そのレースより前の平均）。各欄は 1着率 / 2連対率 / 3連対率（%）。グレードの切り替えは効きません。</div>
      <h3 class="oh">${esc(vv.name)}</h3>${st34Table(vs.st34.venues[code])}
      <h3 class="oh">全国（江戸川を除く23場）</h3>${st34Table(vs.st34.overall)}</div>` : ""}`;
  $("vg").querySelectorAll("button").forEach((b) => b.onclick = () => { state.g = b.dataset.p; renderVenue(); });
  box.querySelectorAll("[data-sv]").forEach((b) => b.addEventListener("click", () => {
    state.venue = b.dataset.sv; store.set("venue", state.venue); renderVenue();
  }));
}

function st34Table(rows) {
  if (!rows) return "";
  const f1 = (x) => x == null ? "-" : x.toFixed(1);
  const best = [1, 2, 3, 4, 5, 6].map((k) => Math.max(...rows.map((r) => r.c[k]?.[0] ?? 0)));
  return `<div class="tbl"><table class="grid2 st34"><thead><tr><th>4コースは<br>3コースより</th><th>数</th>${[1, 2, 3, 4, 5, 6].map((k) =>
    `<th class="${k === 4 ? "c4" : ""}"><span class="waku w${k}">${k}</span></th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>
      <td style="text-align:left;white-space:nowrap">${esc(r.bin)}</td><td>${r.n.toLocaleString()}</td>
      ${[1, 2, 3, 4, 5, 6].map((k) => { const c = r.c[k] || []; return `<td class="${k === 4 ? "c4" : ""}">
        <div class="v ${c[0] === best[k - 1] && r.n ? "pk" : ""}"><b>${f1(c[0])}</b></div><div class="v sub">${f1(c[1])} / ${f1(c[2])}</div></td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="note">各コースで1着率が一番高い段をピンクにしています。</div>`;
}

async function openRacer(regno, course) {
  $("modal").hidden = false;
  $("sheet").innerHTML = '<div class="empty">読み込み中…</div>';
  let r;
  try { r = await getJSON(`data/stats/racers/${regno}.json`); } catch (e) {
    $("sheet").innerHTML = '<button class="close" id="mclose">閉じる</button><div class="empty">この選手の集計はまだありません。</div>';
    $("mclose").onclick = closeModal; return;
  }
  if (!gradeOpts(r.female).some((o) => o[0] === state.g)) state.g = "all";
  const draw = (c) => {
    const sh = r.sheet[state.g] || { course: {}, others: {}, f: 0, st: Object.fromEntries(["total", "slow", "dash", "day", "night", "c1", "c2", "c3", "c4", "c5", "c6"].map((k) => [k, { n: 0, avg: null }])) };
    const own = sh.course[c] || { n: 0, p1: 0, p2: 0, p3: 0 };
    const rows = [1, 2, 3, 4, 5, 6].map((k) => {
      const x = k === c ? own : (sh.others[c]?.[k] || { n: 0, p1: 0, p2: 0, p3: 0 });
      return `<tr class="${k === c ? "own" : ""}"><td>${k}コース<br><small>${k === c ? "(自艇)" : "(他艇)"}</small></td>
        <td>${x.n}</td><td>${x.p1}</td><td>${x.p2}</td><td>${x.p3}</td>
        <td>${pct(x.p1, x.n)}</td><td>${pct(x.p2, x.n)}</td><td>${pct(x.p3, x.n)}</td></tr>`;
    }).join("");
    const seg = [1, 2, 3, 4, 5, 6].map((k) =>
      `<button data-c="${k}" class="${k === c ? "on" : ""}">${k}コース(${sh.course[k]?.n || 0})</button>`).join("");
    const stRows = [["total", "全体"], ["c1", "1コース"], ["c2", "2コース"], ["c3", "3コース"], ["c4", "4コース"],
      ["c5", "5コース"], ["c6", "6コース"], ["slow", "スロー(1〜3)"], ["dash", "ダッシュ(4〜6)"], ["day", "デイ"], ["night", "ナイター"]]
      .map(([k, label]) => `<tr><td style="text-align:left">${label}</td><td>${sh.st[k].avg != null ? sh.st[k].avg.toFixed(2) : "-"}</td><td>${sh.st[k].n}</td></tr>`).join("");
    const total = Object.values(sh.course).reduce((a, x) => a + x.n, 0);
    $("sheet").innerHTML = `
      <button class="close" id="mclose">閉じる</button>
      <h2>${esc(r.name)} <small style="color:var(--sub)">${r.regno}</small></h2>
      <div class="meta"><span>${r.period.from}〜${r.period.to}</span><span>出走 ${total}</span><span>F ${sh.f}回</span></div>
      ${chipRow("sg", gradeOpts(r.female), state.g)}
      <div class="card" style="margin-top:10px"><h2>コース別全艇成績</h2>
        <div class="seg">${seg}</div>
        <div class="tbl"><table><thead><tr><th>コース</th><th>出走</th><th>1着</th><th>2着</th><th>3着</th>
          <th>1着率</th><th>2着率</th><th>3着率</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="note">自艇が${c}コースのレースで、各コースの艇が何着だったか。</div>
      </div>
      <div class="card"><h2>平均スタート</h2>
        <div class="tbl"><table><thead><tr><th></th><th>平均ST</th><th>本数</th></tr></thead><tbody>${stRows}</tbody></table></div>
        <div class="note">フライング・出遅れは平均から除いています。スロー・ダッシュはコース番号(1〜3/4〜6)で分けています。</div>
      </div>
      <div class="note">出走場: ${Object.entries(r.venues).map(([k, n]) => `${esc(k)}${n}`).join("・")}</div>`;
    $("mclose").onclick = closeModal;
    $("sheet").querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => draw(Number(b.dataset.c))));
    $("sg").querySelectorAll("button").forEach((b) => b.onclick = () => { state.g = b.dataset.p; draw(c); });
  };
  draw(Number(course) || 1);
}
function closeModal() { $("modal").hidden = true; }
$("modal").addEventListener("click", (ev) => { if (ev.target.id === "modal") closeModal(); });
$("view-race").addEventListener("click", (ev) => {
  const n = ev.target.closest(".nm");
  if (n && n.dataset.reg) openRacer(n.dataset.reg, n.dataset.course);
});

init();
</script>
</body>
</html>
