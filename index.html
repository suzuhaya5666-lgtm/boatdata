<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ボートデータ">
<title>ボートレース データ</title>
<style>
  :root {
    --bg: #f3f5f9; --card: #fff; --ink: #1d2733; --sub: #6b7684; --line: #e3e7ed;
    --accent: #1565c0; --hit: #d9480f; --cell-off: #eceff4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 15px;
    padding-bottom: calc(64px + env(safe-area-inset-bottom)); -webkit-text-size-adjust: 100%; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; color: var(--ink); cursor: pointer; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .35; }
  main { padding: 12px; max-width: 900px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .meta { color: var(--sub); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  .note { color: var(--sub); font-size: 12px; margin-top: 6px; }

  /* ---- 上部バー */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
  .bar .in { max-width: 900px; margin: 0 auto; }
  .datenav { display: flex; align-items: center; gap: 10px; }
  .datenav .pill { border-radius: 999px; padding: 8px 16px; color: var(--sub); white-space: nowrap; }
  .datenav .label { flex: 1; text-align: center; font-weight: 800; font-size: 18px; position: relative; white-space: nowrap; }
  @media (max-width: 520px) {
    .datenav { gap: 6px; }
    .datenav .pill { padding: 7px 10px; font-size: 14px; }
    .datenav .label { font-size: 16px; }
    .datenav .label .wide { display: none; }
  }
  .datenav .label input { position: absolute; inset: 0; opacity: 0; width: 100%; }
  .datenav .label .cal { font-size: 15px; margin-left: 4px; }
  .back { border: 0; background: none; color: var(--accent); padding: 4px 0; font-weight: 600; }
  .bar h1 { font-size: 20px; margin: 4px 0 0; }
  .bar .sub { color: var(--sub); font-size: 13px; margin-top: 2px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; }
  .chips button { min-width: 46px; padding: 6px 0; }
  .updated { color: var(--sub); font-size: 12px; text-align: right; margin-top: 6px; }

  /* ---- 場選択 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--line); gap: 1px; }
  .cell { background: var(--card); min-height: 132px; padding: 14px 8px; text-align: center; border: 0; border-radius: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .cell .vn { font-size: 24px; font-weight: 800; letter-spacing: .05em; }
  .cell .dl { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .cell .st { font-size: 17px; font-weight: 800; }
  .cell .st.done { color: #9aa3ae; font-weight: 700; }
  .cell .tt { font-size: 11px; color: var(--sub); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell.off { background: var(--cell-off); cursor: default; }
  .cell.off .vn { color: #b0b8c3; }
  .cell { position: relative; }
  .gbr { position: absolute; top: 0; left: 0; display: flex; align-items: center; gap: 4px; }
  .gb { display: inline-block; font-size: 13px; font-weight: 800; padding: 3px 8px; color: #fff; border-radius: 0 0 6px 0; }
  .bar h1 .gb { border-radius: 4px; vertical-align: middle; font-size: 13px; }
  .gip { background: #8c9bb5; } .gg3 { background: #4dabf7; } .gg2 { background: #20c997; }
  .gg1 { background: #f59f00; } .gsg { background: #c92a2a; }
  .gt { font-size: 15px; }
  .night { display: inline-block; background: #d0bfff; color: #3b2a8a; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #e9ecef; color: #6b7684; }
  .tag.final { background: #ffe8cc; color: #d9480f; }

  /* ---- 出走表一覧 */
  .race { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
  .race .head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .race .no { font-size: 24px; font-weight: 800; min-width: 2.2em; }
  .race .dead { font-size: 15px; color: var(--sub); }
  .race .dead b { font-size: 20px; color: var(--ink); margin-left: 4px; }
  .race .badge { margin-left: auto; background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; padding: 6px 10px; border-radius: 6px; }
  .race .badge.wait { background: #e9ecef; color: var(--sub); }
  .lane { display: grid; grid-template-columns: 52px 1fr auto 64px; align-items: center; border-top: 1px solid var(--line); min-height: 52px; }
  .lane .wk { align-self: stretch; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; }
  .lane .nm { padding: 0 12px; font-size: 18px; font-weight: 700; }
  .lane .br { text-align: center; color: var(--ink); font-weight: 600; padding-right: 8px; }
  .lane .pl { font-size: 13px; color: var(--sub); text-align: center; }
  .lane .pl.p1 { color: var(--hit); font-weight: 800; font-size: 15px; }
  .k1 { background: #f1f3f5; color: #000; } .k2 { background: #111; color: #fff; } .k3 { background: #e03131; color: #fff; }
  .k4 { background: #1971c2; color: #fff; } .k5 { background: #ffe03d; color: #000; } .k6 { background: #0ca678; color: #fff; }
  .cls { display: inline-block; font-size: 13px; font-weight: 800; padding: 2px 6px; border-radius: 4px; color: #fff; min-width: 2.4em; text-align: center; }
  .cls.A1 { background: #e8590c; } .cls.A2 { background: #f59f00; } .cls.B1 { background: #1c7ed6; } .cls.B2 { background: #868e96; }
  .res { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 14px; display: flex; gap: 14px; flex-wrap: wrap; color: var(--sub); }
  .res b { color: var(--ink); font-size: 16px; }
  .race .acts { border-top: 1px solid var(--line); padding: 10px 14px; }
  .race .acts button { width: 100%; border: 1.5px solid #1d2733; border-radius: 999px; padding: 10px; font-weight: 700; }

  /* ---- 詳細 */
  .tbl { width: 100%; overflow-x: auto; margin-top: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; white-space: nowrap; }
  th, td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: center; }
  th { color: var(--sub); font-weight: 500; font-size: 12px; }
  td.name { text-align: left; }
  td.name small { color: var(--sub); }
  .waku { display: inline-block; width: 26px; height: 26px; line-height: 24px; border-radius: 6px; font-weight: 700; border: 1px solid #999; }
  .w1 { background: #fff; color: #000; } .w2 { background: #222; color: #fff; } .w3 { background: #e03131; color: #fff; }
  .w4 { background: #1c7ed6; color: #fff; } .w5 { background: #fcc419; color: #000; } .w6 { background: #2f9e44; color: #fff; }
  td.name .cls { font-size: 11px; margin-left: 4px; padding: 1px 4px; }
  .p1 { color: var(--hit); font-weight: 700; }
  .pay { display: grid; grid-template-columns: 4.5em 1fr auto auto; gap: 4px 10px; font-size: 14px; margin-top: 10px; }
  .pay .k { color: var(--sub); }
  .pay .y { text-align: right; font-variant-numeric: tabular-nums; }
  .pay .pp { color: var(--sub); font-size: 12px; }
  .nm[data-reg] { color: var(--accent); cursor: pointer; }
  td.name .nm { text-decoration: underline; text-decoration-color: #b8cff0; }

  /* ---- 詳細タブ */
  .dtabs { display: flex; margin-top: 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .dtabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 8px 4px; color: var(--sub); font-weight: 700; white-space: nowrap;
    border-bottom: 3px solid transparent; }
  .dtabs button.on { color: var(--ink); border-bottom-color: var(--ink); background: none; }
  .pill2 { border-radius: 999px !important; padding: 6px 14px !important; font-weight: 700; }
  .pill2.on { background: var(--ink) !important; border-color: var(--ink) !important; }
  table.cmp td { padding: 6px 4px; }
  table.cmp td.lk { width: 34px; font-weight: 800; font-size: 16px; padding: 0; }
  table.cmp td.name { min-width: 92px; font-weight: 700; }
  table.cmp .pv { font-size: 15px; }
  .cnt { color: #98a1ad; }
  td.r1 .pv, td.r1 { }
  td.r1 { background: #ffd8cc; } td.r2 { background: #fff3bf; }
  td.bad .pv { color: #e03131; }
  td.moved { color: #e03131; font-weight: 800; }
  .new { color: #e03131; font-weight: 800; }
  .part { display: inline-block; background: #fff0f6; color: #c2255c; border-radius: 4px; padding: 1px 5px; margin: 1px; font-size: 12px; }
  .mini { display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center; font-weight: 800; border-radius: 4px; font-size: 13px; border: 1px solid #ccd; }
  td.combo { white-space: nowrap; letter-spacing: 1px; }
  tr.hit td { background: #d3f9d8 !important; font-weight: 800; }
  .slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; }
  .slot small { color: var(--sub); font-size: 11px; }
  .slot.on { background: #fff3bf; border-color: #f59f00; color: var(--ink); }
  .slot .mini { width: 30px; height: 30px; line-height: 30px; font-size: 16px; }
  table.wt { font-size: 12px; margin-top: 4px; }
  table.wt td, table.wt th { padding: 4px 2px; }
  table.wt td.na { color: #ccd; }
  /* ---- 場データ・選手 */
  .seg { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .seg button { padding: 4px 10px; }
  .own td { font-weight: 700; background: #f7faff; }
  .hi { color: var(--hit); font-weight: 700; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  #modal[hidden] { display: none; }
  #modal .sheet { background: var(--bg); width: 100%; max-width: 900px; max-height: 88vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); }
  #modal .close { float: right; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
  nav button { flex: 1; border: 0; border-radius: 0; padding: 12px 0; background: none; color: var(--sub); }
  nav button.on { color: var(--accent); font-weight: 700; background: none; }
</style>
</head>
<body>
<div class="bar" id="bar"><div class="in" id="barIn"></div></div>

<main id="view-race"></main>
<main id="view-venue" hidden></main>
<main id="view-bets" hidden>
  <div class="card" style="color:var(--sub)">舟券の収支記録は次の段階で作ります。</div>
</main>

<nav>
  <button class="on" data-view="race">レース</button>
  <button data-view="venue">場データ</button>
  <button data-view="bets">収支</button>
</nav>
<div id="modal" hidden><div class="sheet" id="sheet"></div></div>

<script>
const BETS = ["単勝", "複勝", "2連単", "2連複", "拡連複", "3連単", "3連複"];
const NIGHT = ["01", "07", "12", "15", "19", "20", "24"];
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const state = { index: null, day: null, date: null, venue: null, race: 1, screen: "home", tab: "race" };
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
const fmt = (v, d = 2) => (v === null || v === undefined) ? "-" : Number(v).toFixed(d);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function statusText(s) {
  if (!s) return "";
  return ({ S: "失格", K: "欠場", L: "出遅", F: "F" })[s[0]] || s;
}
function nowJST() {
  const d = new Date(Date.now() + 9 * 3600 * 1000);
  return { date: d.toISOString().slice(0, 10), time: d.toISOString().slice(11, 16) };
}
function dateLabel(date) {
  const [y, m, d] = date.split("-").map(Number);
  const w = WD[new Date(y, m - 1, d).getDay()];
  return `${date === nowJST().date ? "本日" : ""}${m}月${d}日(${w})`;
}

async function getJSON(path) {
  const r = await fetch(path + "?t=" + Date.now());
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function init() {
  try {
    state.index = await getJSON("data/index.json");
  } catch (e) {
    $("view-race").innerHTML = '<div class="empty">まだデータがありません。</div>';
    return;
  }
  const list = dayList();
  const today = nowJST().date;
  const start = list.includes(today) ? today : list[list.length - 1];
  await loadDay(start);
}

function dayList() { return state.index.days.map((d) => d.date); }

async function loadDay(date) {
  state.date = date;
  try {
    state.day = await getJSON(`data/races/${date.slice(0, 4)}/${date.replace(/-/g, "")}.json`);
  } catch (e) {
    state.day = null;
  }
  if (state.screen !== "home" && !state.day?.venues[state.venue]) state.screen = "home";
  draw();
}

function go(screen, opts = {}) {
  Object.assign(state, opts, { screen });
  if (opts.venue) store.set("venue", opts.venue);
  draw();
  window.scrollTo(0, 0);
  if (screen === "list") scrollToNext();
}

// 今日なら、直近で締切を過ぎたレースの次(=次に締切が来るレース)まで送る
function scrollToNext() {
  const now = nowJST();
  if (state.date !== now.date) return;
  const races = Object.values(state.day.venues[state.venue].races).sort((a, b) => a.no - b.no);
  const next = races.find((r) => r.deadline && r.deadline > now.time);
  if (!next || next.no === races[0].no) return;
  const el = document.getElementById("r" + next.no);
  if (!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY - $("bar").offsetHeight - 10;
  window.scrollTo(0, y);
}

function draw() {
  if (state.tab !== "race") { $("bar").hidden = true; return; }
  $("bar").hidden = false;
  if (state.screen === "home") drawHome();
  else if (state.screen === "list") drawList();
  else drawDetail();
}

// ---------------------------------------------------------------- 場選択
function venueStatus(v) {
  const races = Object.values(v.races).sort((a, b) => a.no - b.no);
  const now = nowJST();
  if (state.date < now.date) return { text: "開催終了", done: true };
  if (state.date > now.date) return { text: `1R ${races[0]?.deadline || ""}`, done: false };
  const next = races.find((r) => r.deadline && r.deadline > now.time && !r.payouts);
  return next ? { text: `${next.no}R ${next.deadline}`, done: false } : { text: "開催終了", done: true };
}
function gradeBadge(v) {
  if (!v.grade) return "";
  const cls = { SG: "gsg", G1: "gg1", G2: "gg2", G3: "gg3" }[v.grade] || "gip";
  const t = { "ヴィーナス": "💗", "ルーキー": "🔰", "レディース": "👩", "マスターズ": "🎖" }[v.gtype] || "";
  return `<span class="gb ${cls}">${esc(v.grade)}</span>${t ? `<span class="gt" title="${esc(v.gtype)}">${t}</span>` : ""}`;
}
function dayText(v) {
  if (v.final) return '<span class="tag final">最終日</span>';
  if (v.day === 1) return "初日";
  return v.day ? `${v.day}日目` : "";
}

function drawHome() {
  const list = dayList();
  const prev = list.filter((d) => d < state.date).pop();
  const next = list.find((d) => d > state.date);
  $("barIn").innerHTML = `
    <div class="datenav">
      <button class="pill" id="prev" ${prev ? "" : "disabled"}>◀ 前日</button>
      <div class="label">${dateLabel(state.date)}<span class="wide">のレース</span><span class="cal">📅</span>
        <input type="date" id="pick" value="${state.date}" min="${list[0]}" max="${list[list.length - 1]}"></div>
      <button class="pill" id="next" ${next ? "" : "disabled"}>翌日 ▶</button>
    </div>`;
  $("prev").onclick = () => prev && loadDay(prev);
  $("next").onclick = () => next && loadDay(next);
  $("pick").onchange = (ev) => ev.target.value && loadDay(ev.target.value);

  const cells = Object.entries(state.index.venues).map(([code, name]) => {
    const v = state.day?.venues[code];
    if (!v) return `<div class="cell off"><div class="vn">${esc(name)}</div></div>`;
    const s = venueStatus(v);
    return `<button class="cell" data-v="${code}">
      <div class="gbr">${gradeBadge(v)}</div>
      <div class="vn">${esc(name)}</div>
      <div class="dl">${dayText(v)}${NIGHT.includes(code) ? '<span class="night">🌙</span>' : ""}</div>
      <div class="st ${s.done ? "done" : ""}">${s.text}</div>
      <div class="tt">${esc(v.title || "")}</div>
    </button>`;
  }).join("");
  $("view-race").innerHTML = `<div class="grid">${cells}</div>
    <div class="updated">データ更新 ${esc(state.index.updated)}</div>`;
  $("view-race").querySelectorAll("[data-v]").forEach((b) =>
    b.addEventListener("click", () => go("list", { venue: b.dataset.v })));
}

// ---------------------------------------------------------------- 出走表一覧
function drawList() {
  const v = state.day.venues[state.venue];
  $("barIn").innerHTML = `
    <button class="back" id="back">‹ 場選択</button>
    <h1>${gradeBadge(v)} ${esc(v.name)} <span style="font-size:15px;font-weight:600">${dateLabel(state.date)}</span></h1>
    <div class="sub">${esc(v.title || "")} ${v.final ? "・最終日" : v.day ? `・${v.day === 1 ? "初日" : v.day + "日目"}` : ""}</div>`;
  $("back").onclick = () => go("home");

  const now = nowJST();
  const races = Object.values(v.races).sort((a, b) => a.no - b.no);
  $("view-race").innerHTML = races.map((r) => {
    const done = r.payouts && Object.keys(r.payouts).length;
    const closed = !done && (state.date < now.date || (state.date === now.date && r.deadline && r.deadline <= now.time));
    const badge = done ? '<span class="badge">結果確定</span>' : closed ? '<span class="badge wait">締切</span>' : "";
    const lanes = r.entries.map((e) => `
      <div class="lane">
        <div class="wk k${e.boat}">${e.boat}</div>
        <div><span class="nm" data-reg="${e.regno || ""}" data-course="${e.boat}">${esc(e.name || "")}</span></div>
        <div>${e.class ? `<span class="cls ${e.class}">${e.class}</span>` : ""}</div>
        ${done ? `<div class="pl ${e.place === 1 ? "p1" : ""}">${e.place ? e.place + "着" : esc(statusText(e.status))}</div>`
               : `<div class="br">${esc(e.branch || "")}</div>`}
      </div>`).join("");
    const tri = r.payouts?.["3連単"]?.[0];
    const res = done ? `<div class="res">
        ${tri ? `<span>3連単 <b>${tri.combo}</b> ${tri.yen.toLocaleString()}円${tri.pop ? `(${tri.pop}番人気)` : ""}</span>` : ""}
        ${r.kimarite ? `<span>決まり手 <b>${esc(r.kimarite)}</b></span>` : ""}</div>` : "";
    return `<div class="race" id="r${r.no}">
      <div class="head"><span class="no">${r.no}R</span><span class="tag">${esc(r.name || "")}</span>
        <span class="dead">締切<b>${r.deadline || "-"}</b></span>${badge}</div>
      ${lanes}${res}
      <div class="acts"><button data-r="${r.no}">出走表・結果をくわしく見る</button></div>
    </div>`;
  }).join("");
  $("view-race").querySelectorAll("button[data-r]").forEach((b) =>
    b.addEventListener("click", () => go("detail", { race: Number(b.dataset.r) })));
}

// ---------------------------------------------------------------- レース詳細
function drawDetail() {
  const v = state.day.venues[state.venue];
  const nos = Object.keys(v.races).map(Number).sort((a, b) => a - b);
  const tabs = [["card", "出走表"], ["racer", "選手成績"], ["exh", "展示情報"], ["motor", "モーター"], ["deme", "出目確率"]];
  state.dtab = state.dtab || "card";
  $("barIn").innerHTML = `
    <button class="back" id="back">‹ ${esc(v.name)}の一覧</button>
    <div class="chips">${nos.map((n) => `<button data-r="${n}" class="${n === state.race ? "on" : ""}">${n}R</button>`).join("")}</div>
    <div class="dtabs">${tabs.map(([k, l]) => `<button data-t="${k}" class="${k === state.dtab ? "on" : ""}">${l}</button>`).join("")}</div>`;
  $("back").onclick = () => go("list");
  $("barIn").querySelectorAll("[data-r]").forEach((b) =>
    b.addEventListener("click", () => go("detail", { race: Number(b.dataset.r) })));
  $("barIn").querySelectorAll("[data-t]").forEach((b) =>
    b.addEventListener("click", () => { state.dtab = b.dataset.t; drawDetail(); window.scrollTo(0, 0); }));

  const race = v.races[String(state.race)];
  if (state.dtab === "racer") return drawRacerTab(v, race);
  if (state.dtab === "exh") return drawExhTab(v, race);
  if (state.dtab === "motor") return drawMotorTab(v, race);
  if (state.dtab === "deme") return drawDemeTab(v, race);
  drawCardTab(v, race);
}

// ---------------------------------------------------------------- 共通
const cache = {};
async function cached(path) {
  if (!(path in cache)) {
    cache[path] = getJSON(path).catch(() => null);
  }
  return cache[path];
}
const loading = () => { $("view-race").innerHTML = '<div class="empty">読み込み中…</div>'; };
const pctv = (a, n) => n ? a / n * 100 : null;
const pcell = (a, n, cls = "") => n
  ? `<td class="${cls}"><span class="pv">${(a / n * 100).toFixed(1)}<small>%</small></span><br><small class="cnt">(${a}/${n}回)</small></td>`
  : `<td class="${cls}">-</td>`;
// 列ごとに1番を赤、2番を黄で塗る
function ranks(values) {
  const uniq = [...new Set(values.filter((x) => x != null && x > 0))].sort((a, b) => b - a);
  return values.map((x) => x == null || x <= 0 ? "" : x === uniq[0] ? "r1" : x === uniq[1] ? "r2" : "");
}
function lane(e) {
  return `<td class="lk k${e.boat}">${e.boat}</td>
    <td class="name"><span class="nm" data-reg="${e.regno || ""}" data-course="${e.boat}">${esc(e.name || "")}</span>
      ${e.class ? `<br><span class="cls ${e.class}">${e.class}</span>` : ""}</td>`;
}
const GRADE_BASE = [["all", "総合"], ["ippan", "一般戦"], ["g2g3", "G2・G3"], ["sgg1", "SG・G1"]];
const GRADE_OPTS = [...GRADE_BASE, ["women", "女子戦"]];
// 女子選手がいるときは「女子戦」を出し、一般戦は男女混合と分かる名前にする
function gradeOpts(female) {
  return female ? [["all", "総合"], ["ippan", "一般戦(男女混合)"], ["g2g3", "G2・G3"], ["sgg1", "SG・G1"], ["women", "女子戦"]] : GRADE_BASE;
}
state.g = "all";
function chipRow(id, opts, cur) {
  return `<div class="seg" id="${id}">${opts.map(([k, l]) => `<button data-p="${k}" class="pill2 ${k === cur ? "on" : ""}">${l}</button>`).join("")}</div>`;
}

// ---------------------------------------------------------------- 選手成績
async function drawRacerTab(v, race) {
  loading();
  const files = await Promise.all(race.entries.map((e) => cached(`data/stats/racers/${e.regno}.json`)));
  if (state.dtab !== "racer") return;
  state.rp = state.rp || "10";
  state.kp = state.kp || "6m";
  const pick = (r, period, c) => {
    if (!r || !r.bycourse) return null;
    if (period === "local") return r.bycourse.local?.[state.venue]?.[c] || null;
    const key = state.g !== "all" && (period === "6m" || period === "1y") ? `${period}_${state.g}` : period;
    return r.bycourse[key]?.[c] || null;
  };
  const anyFemale = files.some((f) => f?.female);
  const gopts = gradeOpts(anyFemale);
  if (!gopts.some((o) => o[0] === state.g)) state.g = "all";
  const gNote = state.g !== "all" ? `<div class="note">グレードの切り替えは、直近6ヶ月と直近1年に効きます。</div>` : "";
  // 枠別着率(枠番=コースとして、その選手がそのコースで走ったときの成績)
  const rows = race.entries.map((e, i) => ({ e, b: pick(files[i], state.rp, String(e.boat)) }));
  const cols = [
    (b) => b ? [b.p1 + b.p2 + b.p3, b.n] : null,
    (b) => b ? [b.p1, b.n] : null,
    (b) => b ? [b.p2, b.n] : null,
    (b) => b ? [b.p3, b.n] : null,
  ];
  const rk = cols.map((f) => ranks(rows.map(({ b }) => { const x = f(b); return x ? pctv(x[0], x[1]) : null; })));
  const t1 = rows.map(({ e, b }, i) => `<tr>${lane(e)}${cols.map((f, j) => { const x = f(b); return x ? pcell(x[0], x[1], rk[j][i]) : "<td>-</td>"; }).join("")}</tr>`).join("");

  // 決まり手
  const krow = race.entries.map((e, i) => {
    const b = pick(files[i], state.kp, String(e.boat));
    return { e, b };
  });
  const keys1 = [["win", "逃げ", "逃げ"], ["lost", "差し", "差され"], ["lost", "まくり", "まくられ"], ["lost", "まくり差し", "まくられ差"]];
  const keysN = [["nigashi", null, "逃し"], ["win", "差し", "差し"], ["win", "まくり", "まくり"], ["win", "まくり差し", "まくり差し"]];
  const val = (b, [grp, k]) => {
    if (!b) return null;
    if (grp === "nigashi") return [b.nigashi || 0, b.n];
    return [b[grp]?.[k] || 0, b.n];
  };
  const one = krow[0];
  const t2a = `<tr>${lane(one.e)}${keys1.map((k, j) => {
    const x = val(one.b, k);
    return x ? pcell(x[0], x[1], j > 0 && x[0] ? "bad" : "") : "<td>-</td>";
  }).join("")}</tr>`;
  const others = krow.slice(1);
  const rk2 = keysN.map((k) => ranks(others.map(({ b }) => { const x = val(b, k); return x ? pctv(x[0], x[1]) : null; })));
  const t2b = others.map(({ e, b }, i) => `<tr>${lane(e)}${keysN.map((k, j) => {
    if (j === 0 && e.boat !== 2) return "<td>-</td>";
    const x = val(b, k);
    return x ? pcell(x[0], x[1], j === 0 ? "" : rk2[j][i]) : "<td>-</td>";
  }).join("")}</tr>`).join("");

  $("view-race").innerHTML = `
    <div class="card">
      <h2>枠別着率</h2>
      ${chipRow("rg", gopts, state.g)}
      ${chipRow("rp", [["10", "直近10走"], ["6m", "直近6ヶ月"], ["1y", "直近1年"], ["local", "当地"]], state.rp)}${gNote}
      <div class="tbl"><table class="cmp"><thead><tr><th>枠</th><th>選手</th><th>3連対率</th><th>1着率</th><th>2着率</th><th>3着率</th></tr></thead>
        <tbody>${t1}</tbody></table></div>
      <div class="note">それぞれの選手が、この枠と同じコースで走ったときの成績です（直近10走はそのコースでの直近10回）。当地は${esc(v.name)}での直近1年。</div>
    </div>
    <div class="card">
      <h2>決まり手率</h2>
      ${chipRow("kg", gopts, state.g)}
      ${chipRow("kp", [["6m", "直近6ヶ月"], ["1y", "直近1年"]], state.kp)}
      <div class="tbl"><table class="cmp"><thead><tr><th>枠</th><th>選手</th><th>逃げ</th><th>差され</th><th>まくられ</th><th>まくられ差</th></tr></thead>
        <tbody>${t2a}</tbody></table></div>
      <div class="tbl"><table class="cmp"><thead><tr><th>枠</th><th>選手</th><th>逃し</th><th>差し</th><th>まくり</th><th>まくり差し</th></tr></thead>
        <tbody>${t2b}</tbody></table></div>
      <div class="note">1号艇は1コースで走ったとき、逃げ切った率と、差し・まくり・まくり差しで負けた率。2〜6号艇はそのコースで、差し・まくり・まくり差しで勝った率。逃しは2コースで1コースに逃げられた率。</div>
    </div>`;
  ["rg", "kg"].forEach((id) => $(id).querySelectorAll("button").forEach((b) => b.onclick = () => { state.g = b.dataset.p; drawRacerTab(v, race); }));
  $("rp").querySelectorAll("button").forEach((b) => b.onclick = () => { state.rp = b.dataset.p; drawRacerTab(v, race); });
  $("kp").querySelectorAll("button").forEach((b) => b.onclick = () => { state.kp = b.dataset.p; drawRacerTab(v, race); });
}

}

// ---------------------------------------------------------------- 出目確率
// 重み W[着][対象コース][情報源] (情報源 0=自艇, c=コースcの選手から見た値) で
// 各艇の1〜3着確率を出し、3連単120通りに組み立てる。
const ZERO = { n: 0, p1: 0, p2: 0, p3: 0 };
function demeQ(order, racers, vstat, model) {
  const m = model.m;
  const prior = {};
  for (let k = 1; k <= 6; k++) {
    const c = vstat.course[k];
    prior[k] = [1, 2, 3].map((j) => (c[`p${j}`] + 1) / (c.n + 6));
  }
  const rate = (x, k, j) => (x[`p${j + 1}`] + m * prior[k][j]) / (x.n + m);
  const q = {};
  for (let k = 1; k <= 6; k++) q[k] = [0, 0, 0];
  for (let j = 0; j < 3; j++) {
    for (let k = 1; k <= 6; k++) {
      const me = racers[order[k]]?.sheet?.all;
      let v = model.W[j][k][0] * rate(me?.course?.[k] || ZERO, k, j);
      for (let c = 1; c <= 6; c++) {
        if (c === k) continue;
        const o = racers[order[c]]?.sheet?.all?.others?.[c]?.[k] || ZERO;
        v += model.W[j][k][c] * rate(o, k, j);
      }
      q[k][j] = Math.max(v, 1e-6);
    }
    const s = [1, 2, 3, 4, 5, 6].reduce((a, k) => a + q[k][j], 0);
    for (let k = 1; k <= 6; k++) q[k][j] /= s;
  }
  return q;
}
function demeTri(q) {
  const out = [];
  for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) for (let c = 1; c <= 6; c++) {
    if (a === b || b === c || a === c) continue;
    const p = q[a][0] * q[b][1] / (1 - q[a][1]) * q[c][2] / (1 - q[a][2] - q[b][2]);
    out.push({ c: [a, b, c], p });
  }
  const s = out.reduce((x, y) => x + y.p, 0);
  out.forEach((o) => { o.p /= s; });
  return out.sort((x, y) => y.p - x.p);
}
function sumBy(tri, keyFn) {
  const m = new Map();
  tri.forEach((t) => { const k = keyFn(t.c); m.set(k, (m.get(k) || 0) + t.p); });
  return [...m.entries()].map(([k, p]) => ({ k, p })).sort((a, b) => b.p - a.p);
}

async function drawDemeTab(v, race) {
  loading();
  const hd = state.date.replace(/-/g, "");
  const [model, vs, bi, ...files] = await Promise.all([
    cached("data/model/weights.json"), cached("data/stats/venues.json"),
    getJSON(`data/before/${hd}/${state.venue}_${String(race.no).padStart(2, "0")}.json`).catch(() => null),
    ...race.entries.map((e) => cached(`data/stats/racers/${e.regno}.json`))]);
  if (state.dtab !== "deme") return;
  if (!model || !vs) { $("view-race").innerHTML = '<div class="empty">出目確率のデータがまだありません。</div>'; return; }
  const racers = Object.fromEntries(race.entries.map((e, i) => [e.boat, files[i]]));
  const ents = Object.fromEntries(race.entries.map((e) => [e.boat, e]));

  // 進入: 展示進入 → なければ枠なり。手で入れ替えたものは レースごとに覚える
  const key = `${state.date}_${state.venue}_${race.no}`;
  let base = [0, 1, 2, 3, 4, 5, 6], baseLabel = "枠なり（展示前）";
  if (bi?.start?.length === 6) { base = [0, ...bi.start.map((s) => s.boat)]; baseLabel = "スタート展示の進入"; }
  state.orders = state.orders || {};
  const order = state.orders[key] || base;
  const custom = !!state.orders[key];

  const q = demeQ(order, racers, vs.venues[state.venue].all, model);
  const tri = demeTri(q);
  const done = race.entries.some((e) => e.place === 1);
  const res = done ? [1, 2, 3].map((p) => race.entries.find((e) => e.place === p)?.boat) : null;
  const boatOf = (c) => order[c];
  const bb = (b) => `<span class="mini k${b}">${b}</span>`;
  const isHit = (boats) => res && boats.every((b, i) => b === res[i]);

  // 各艇の確率表(コース順)
  const cols = [0, 1, 2].map((j) => ranks([1, 2, 3, 4, 5, 6].map((c) => q[c][j])));
  const rows = [1, 2, 3, 4, 5, 6].map((c, i) => {
    const e = ents[boatOf(c)];
    return `<tr><td class="${c !== e.boat ? "moved" : ""}">${c}</td>${lane(e)}
      ${[0, 1, 2].map((j) => `<td class="${cols[j][i]}">${(q[c][j] * 100).toFixed(1)}%</td>`).join("")}
      <td>${((q[c][0] + q[c][1]) * 100).toFixed(1)}%</td></tr>`;
  }).join("");

  // 3連単(艇番で表示)
  const triB = tri.map((t) => ({ b: t.c.map(boatOf), p: t.p }));
  const hitRank = res ? triB.findIndex((t) => isHit(t.b)) : -1;
  const list = (items, n, fmtKey) => items.slice(0, n).map((t, i) => `
    <tr class="${t.hit ? "hit" : ""}"><td>${i + 1}</td><td class="combo">${fmtKey(t)}</td>
      <td>${(t.p * 100).toFixed(1)}%</td><td>${(1 / t.p).toFixed(1)}倍</td></tr>`).join("");
  const triRows = list(triB.map((t) => ({ ...t, hit: isHit(t.b) })), 20, (t) => t.b.map(bb).join("-"));
  const exa = sumBy(triB.map((t) => ({ c: t.b, p: t.p })), (c) => `${c[0]}-${c[1]}`)
    .map((x) => ({ ...x, hit: res && x.k === `${res[0]}-${res[1]}` }));
  const trio = sumBy(triB.map((t) => ({ c: t.b, p: t.p })), (c) => [...c].sort().join("="))
    .map((x) => ({ ...x, hit: res && x.k === [...res].sort().join("=") }));
  const quin = sumBy(triB.map((t) => ({ c: t.b, p: t.p })), (c) => [c[0], c[1]].sort().join("="))
    .map((x) => ({ ...x, hit: res && x.k === [res[0], res[1]].sort().join("=") }));
  const keyFmt = (sep) => (t) => t.k.split(sep).map(Number).map(bb).join(sep === "=" ? "=" : "-");

  // 進入の入れ替え
  const slots = [1, 2, 3, 4, 5, 6].map((c) =>
    `<button class="slot ${state.pick === c ? "on" : ""}" data-slot="${c}"><small>${c}コース</small>${bb(boatOf(c))}</button>`).join("");

  $("view-race").innerHTML = `
    <div class="card">
      <h2>進入</h2>
      <div class="slots">${slots}</div>
      <div class="note">${custom ? "手で入れ替えた進入で計算しています。" : `${baseLabel}で計算しています。`}
        入れ替えたい2つの枠を順にタップすると入れ替わります。</div>
      ${custom ? '<button class="pill2" id="resetOrder" style="margin-top:8px">' + (bi?.start?.length === 6 ? "展示進入" : "枠なり") + "に戻す</button>" : ""}
    </div>
    <div class="card">
      <h2>各艇の着順確率</h2>
      <div class="tbl"><table class="cmp"><thead><tr><th>コース</th><th>枠</th><th>選手</th><th>1着</th><th>2着</th><th>3着</th><th>2連対</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
    <div class="card">
      <h2>3連単 上位20点</h2>
      ${res ? `<div class="meta"><span>結果 ${res.map(bb).join("-")} は ${hitRank + 1}番目（${(triB[hitRank].p * 100).toFixed(1)}%）</span></div>` : ""}
      <div class="tbl"><table class="cmp"><thead><tr><th>順</th><th>買い目</th><th>確率</th><th>目安オッズ</th></tr></thead>
        <tbody>${triRows}</tbody></table></div>
      <div class="note">目安オッズは 1÷確率。実際のオッズがこれより高ければ、確率の上では割に合う買い目です。上位20点の合計 ${(triB.slice(0, 20).reduce((a, t) => a + t.p, 0) * 100).toFixed(1)}%。</div>
    </div>
    <div class="card"><h2>2連単 上位10点</h2>
      <div class="tbl"><table class="cmp"><thead><tr><th>順</th><th>買い目</th><th>確率</th><th>目安オッズ</th></tr></thead>
        <tbody>${list(exa, 10, keyFmt("-"))}</tbody></table></div></div>
    <div class="card"><h2>3連複 上位10点</h2>
      <div class="tbl"><table class="cmp"><thead><tr><th>順</th><th>買い目</th><th>確率</th><th>目安オッズ</th></tr></thead>
        <tbody>${list(trio, 10, keyFmt("="))}</tbody></table></div></div>
    <div class="card"><h2>2連複 上位6点</h2>
      <div class="tbl"><table class="cmp"><thead><tr><th>順</th><th>買い目</th><th>確率</th><th>目安オッズ</th></tr></thead>
        <tbody>${list(quin, 6, keyFmt("="))}</tbody></table></div></div>
    <div class="card"><h2>計算のしかた</h2>
      <div class="note" style="font-size:13px;line-height:1.7">
        各艇の1〜3着確率は、<b>自艇の成績</b>（その選手がそのコースで走ったときの着率）と、<b>他艇から見た成績</b>（ほかの選手のレースで、そのコースの艇が何着だったか）を、着ごと・コースごとに決めた重みで混ぜています。
        走った回数が少ない成績は、${esc(v.name)}のコース別平均に${model.m}走分寄せています。
        重みは過去${model.races.toLocaleString()}レース（${model.from}〜${model.to}）で、実際の着順に一番合うように毎月作り直しています。</div>
      <div class="tbl">${weightTable(model)}</div>
    </div>`;

  $("view-race").querySelectorAll("[data-slot]").forEach((b) => b.onclick = () => {
    const c = Number(b.dataset.slot);
    if (!state.pick) { state.pick = c; }
    else {
      if (state.pick !== c) {
        const o = [...order];
        [o[state.pick], o[c]] = [o[c], o[state.pick]];
        state.orders[key] = o.join() === base.join() ? undefined : o;
        if (!state.orders[key]) delete state.orders[key];
      }
      state.pick = null;
    }
    drawDemeTab(v, race);
  });
  const rb = $("resetOrder");
  if (rb) rb.onclick = () => { delete state.orders[key]; state.pick = null; drawDemeTab(v, race); };
}

function weightTable(model) {
  const head = ["自艇", "1コース", "2コース", "3コース", "4コース", "5コース", "6コース"];
  return [0, 1, 2].map((j) => `
    <div style="margin-top:10px;font-weight:700">${j + 1}着確率の重み</div>
    <table class="wt"><thead><tr><th>対象</th>${head.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${[1, 2, 3, 4, 5, 6].map((k) => `<tr><td>${k}コース</td>${[0, 1, 2, 3, 4, 5, 6].map((s) => {
      const w = model.W[j][k][s];
      return s === k ? '<td class="na">—</td>' : `<td style="background:rgba(21,101,192,${Math.min(w, 1) * 0.55})">${w >= 0.005 ? Math.round(w * 100) : ""}</td>`;
    }).join("")}</tr>`).join("")}
    </tbody></table>`).join("") + '<div class="note">数字は%。行のコースの艇の確率を出すとき、どこからの情報をどれだけ使っているか。</div>';
}

// ---------------------------------------------------------------- モーター成績
async function drawMotorTab(v, race) {
  loading();
  const ms = await cached("data/stats/motors.json");
  if (state.dtab !== "motor") return;
  const mv = ms?.venues?.[state.venue];
  if (!mv) { $("view-race").innerHTML = '<div class="empty">モーターの集計がまだありません。</div>'; return; }
  state.mp = state.mp || "all";
  const all = Object.entries(mv.motors).map(([no, p]) => ({ no: Number(no), s: p[state.mp] }))
    .filter((m) => m.s && m.s.n > 0)
    .map((m) => ({ ...m, win: m.s.pts / m.s.n, r2: (m.s.p1 + m.s.p2) / m.s.n * 100, r3: (m.s.p1 + m.s.p2 + m.s.p3) / m.s.n * 100 }));
  const rankBy = (key) => {
    const s = [...all].sort((a, b) => b[key] - a[key]);
    return Object.fromEntries(s.map((m, i) => [m.no, i + 1]));
  };
  const rWin = rankBy("win"), r2 = rankBy("r2");
  const total = all.length;
  const mine = race.entries.map((e) => ({ e, m: all.find((x) => x.no === e.motor_no) }));
  const winRk = ranks(mine.map(({ m }) => m ? m.win : null));
  const r2Rk = ranks(mine.map(({ m }) => m ? m.r2 : null));
  const rows = mine.map(({ e, m }, i) => `<tr>${lane(e)}
    <td>${e.motor_no ?? "-"}</td>
    <td class="${winRk[i]}">${m ? m.win.toFixed(2) : "-"}${m ? `<br><small class="cnt">${rWin[m.no]}位/${total}機</small>` : ""}</td>
    <td class="${r2Rk[i]}">${m ? m.r2.toFixed(1) + "%" : "-"}${m ? `<br><small class="cnt">${r2[m.no]}位/${total}機</small>` : ""}</td>
    <td>${m ? m.r3.toFixed(1) + "%" : "-"}</td>
    <td>${m ? m.s.n : "-"}</td>
    <td>${e.motor_2 != null ? e.motor_2.toFixed(1) + "%" : "-"}</td></tr>`).join("");
  const here = new Set(race.entries.map((e) => e.motor_no));
  const top = [...all].sort((a, b) => b.win - a.win).map((m, i) => `
    <tr class="${here.has(m.no) ? "own" : ""}"><td>${i + 1}</td><td>${m.no}</td><td>${m.win.toFixed(2)}</td>
      <td>${m.r2.toFixed(1)}%</td><td>${m.r3.toFixed(1)}%</td><td>${m.s.n}</td></tr>`).join("");
  $("view-race").innerHTML = `
    <div class="card">
      <h2>モーター成績</h2>
      ${chipRow("mp", [["1m", "直近1ヶ月"], ["3m", "直近3ヶ月"], ["6m", "直近6ヶ月"], ["all", "全て"]], state.mp)}
      <div class="tbl"><table class="cmp"><thead><tr><th>枠</th><th>選手</th><th>No</th><th>勝率<br><small>場内順位</small></th>
        <th>2連対率<br><small>場内順位</small></th><th>3連対率</th><th>出走</th><th>公式<br>2連率</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="note">今のモーターの使い始め（${esc(mv.start)}）からの成績です。「全て」はその期間すべて。勝率は1着10点・2着8点・3着6点・4着4点・5着2点・6着1点の平均。公式2連率は出走表の値です。</div>
    </div>
    <div class="card">
      <h2>${esc(v.name)} モーター勝率ランキング</h2>
      <div class="tbl" style="max-height:420px;overflow-y:auto"><table><thead><tr><th>順位</th><th>No</th><th>勝率</th><th>2連対率</th><th>3連対率</th><th>出走</th></tr></thead>
        <tbody>${top}</tbody></table></div>
      <div class="note">このレースで使うモーターを色付きで表示しています。</div>
    </div>`;
  $("mp").querySelectorAll("button").forEach((b) => b.onclick = () => { state.mp = b.dataset.p; drawMotorTab(v, race); });
}

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
  if (b.dataset.view === "race" && state.tab === "race") { go("home"); return; }
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
  state.tab = b.dataset.view;
  $("view-race").hidden = state.tab !== "race";
  $("view-venue").hidden = state.tab !== "venue";
  $("view-bets").hidden = state.tab !== "bets";
  draw();
  if (state.tab === "venue") renderVenue();
}));

// ---------------------------------------------------------------- 集計データ
const pct = (a, n) => n ? (a / n * 100).toFixed(1) + "%" : "-";
let venueStats = null;
async function getVenueStats() {
  if (!venueStats) venueStats = await getJSON("data/stats/venues.json");
  return venueStats;
}

async function renderVenue() {
  const box = $("view-venue");
  let vs;
  try { vs = await getVenueStats(); } catch (e) {
    box.innerHTML = '<div class="empty">集計データがまだありません。</div>'; return;
  }
  const code = state.venue && vs.venues[state.venue] ? state.venue : Object.keys(vs.venues)[0];
  const vv = vs.venues[code];
  const v = { name: vv.name, ...(vv[state.g] || vv.all) };
  const gName = GRADE_OPTS.find((x) => x[0] === state.g)?.[1] || "総合";
  const seg = Object.entries(vs.venues).map(([c, x]) =>
    `<button data-sv="${c}" class="${c === code ? "on" : ""}">${esc(x.name)}</button>`).join("");
  const crow = [1, 2, 3, 4, 5, 6].map((c) => {
    const x = v.course[c];
    const km = Object.entries(v.kimarite[c] || {}).sort((a, b) => b[1] - a[1]).slice(0, 2)
      .map(([k, n]) => `${esc(k)}${n}`).join(" ");
    return `<tr><td><span class="waku w${c}">${c}</span></td><td>${x.n}</td><td>${x.p1}</td><td>${x.p2}</td><td>${x.p3}</td>
      <td class="${c === 1 ? "hi" : ""}">${pct(x.p1, x.n)}</td><td>${pct(x.p1 + x.p2, x.n)}</td><td>${pct(x.p1 + x.p2 + x.p3, x.n)}</td>
      <td style="text-align:left">${km}</td></tr>`;
  }).join("");
  const rrow = Object.entries(v.race).map(([no, r]) => `
    <tr><td>${no}R</td><td>${r.n}</td>
      ${[1, 2, 3, 4, 5, 6].map((c) => `<td class="${c === 1 ? "hi" : ""}">${pct(r.course_win[c], r.n)}</td>`).join("")}
      <td>${r.tri_avg ? r.tri_avg.toLocaleString() : "-"}</td><td>${r.tri_median ? r.tri_median.toLocaleString() : "-"}</td>
      <td>${r.man_rate ?? "-"}%</td><td>${r.fav_rate ?? "-"}%</td></tr>`).join("");
  box.innerHTML = `
    <div class="seg">${seg}</div>
    ${chipRow("vg", GRADE_OPTS, state.g)}
    <div class="card"><h2>${esc(v.name)} コース別成績</h2>
      <div class="meta"><span>${vs.period.from}〜${vs.period.to}</span><span>${gName}（${v.course["1"].n}レース）</span></div>
      <div class="tbl"><table><thead><tr><th>コース</th><th>出走</th><th>1着</th><th>2着</th><th>3着</th>
        <th>1着率</th><th>2連対率</th><th>3連対率</th><th>主な決まり手</th></tr></thead><tbody>${crow}</tbody></table></div>
    </div>
    <div class="card"><h2>${esc(v.name)} レース別成績</h2>
      <div class="tbl"><table><thead><tr><th>R</th><th>数</th>
        ${[1, 2, 3, 4, 5, 6].map((c) => `<th>${c}コース<br>1着率</th>`).join("")}
        <th>3連単<br>平均</th><th>3連単<br>中央値</th><th>万舟率</th><th>1番人気<br>決着率</th></tr></thead>
        <tbody>${rrow}</tbody></table></div>
      <div class="note">平均は高配当に引っぱられるので、ふだんの配当の目安は中央値を見てください。</div>
    </div>`;
  $("vg").querySelectorAll("button").forEach((b) => b.onclick = () => { state.g = b.dataset.p; renderVenue(); });
  box.querySelectorAll("[data-sv]").forEach((b) => b.addEventListener("click", () => {
    state.venue = b.dataset.sv; store.set("venue", state.venue); renderVenue();
  }));
}

async function openRacer(regno, course) {
  $("modal").hidden = false;
  $("sheet").innerHTML = '<div class="empty">読み込み中…</div>';
  let r;
  try { r = await getJSON(`data/stats/racers/${regno}.json`); } catch (e) {
    $("sheet").innerHTML = '<button class="close" id="mclose">閉じる</button><div class="empty">この選手の集計はまだありません。</div>';
    $("mclose").onclick = closeModal; return;
  }
  if (!gradeOpts(r.female).some((o) => o[0] === state.g)) state.g = "all";
  const draw = (c) => {
    const sh = r.sheet[state.g] || { course: {}, others: {}, f: 0, st: Object.fromEntries(["total", "slow", "dash", "day", "night", "c1", "c2", "c3", "c4", "c5", "c6"].map((k) => [k, { n: 0, avg: null }])) };
    const own = sh.course[c] || { n: 0, p1: 0, p2: 0, p3: 0 };
    const rows = [1, 2, 3, 4, 5, 6].map((k) => {
      const x = k === c ? own : (sh.others[c]?.[k] || { n: 0, p1: 0, p2: 0, p3: 0 });
      return `<tr class="${k === c ? "own" : ""}"><td>${k}コース<br><small>${k === c ? "(自艇)" : "(他艇)"}</small></td>
        <td>${x.n}</td><td>${x.p1}</td><td>${x.p2}</td><td>${x.p3}</td>
        <td>${pct(x.p1, x.n)}</td><td>${pct(x.p2, x.n)}</td><td>${pct(x.p3, x.n)}</td></tr>`;
    }).join("");
    const seg = [1, 2, 3, 4, 5, 6].map((k) =>
      `<button data-c="${k}" class="${k === c ? "on" : ""}">${k}コース(${sh.course[k]?.n || 0})</button>`).join("");
    const stRows = [["total", "全体"], ["c1", "1コース"], ["c2", "2コース"], ["c3", "3コース"], ["c4", "4コース"],
      ["c5", "5コース"], ["c6", "6コース"], ["slow", "スロー(1〜3)"], ["dash", "ダッシュ(4〜6)"], ["day", "デイ"], ["night", "ナイター"]]
      .map(([k, label]) => `<tr><td style="text-align:left">${label}</td><td>${sh.st[k].avg != null ? sh.st[k].avg.toFixed(2) : "-"}</td><td>${sh.st[k].n}</td></tr>`).join("");
    const total = Object.values(sh.course).reduce((a, x) => a + x.n, 0);
    $("sheet").innerHTML = `
      <button class="close" id="mclose">閉じる</button>
      <h2>${esc(r.name)} <small style="color:var(--sub)">${r.regno}</small></h2>
      <div class="meta"><span>${r.period.from}〜${r.period.to}</span><span>出走 ${total}</span><span>F ${sh.f}回</span></div>
      ${chipRow("sg", gradeOpts(r.female), state.g)}
      <div class="card" style="margin-top:10px"><h2>コース別全艇成績</h2>
        <div class="seg">${seg}</div>
        <div class="tbl"><table><thead><tr><th>コース</th><th>出走</th><th>1着</th><th>2着</th><th>3着</th>
          <th>1着率</th><th>2着率</th><th>3着率</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="note">自艇が${c}コースのレースで、各コースの艇が何着だったか。</div>
      </div>
      <div class="card"><h2>平均スタート</h2>
        <div class="tbl"><table><thead><tr><th></th><th>平均ST</th><th>本数</th></tr></thead><tbody>${stRows}</tbody></table></div>
        <div class="note">フライング・出遅れは平均から除いています。スロー・ダッシュはコース番号(1〜3/4〜6)で分けています。</div>
      </div>
      <div class="note">出走場: ${Object.entries(r.venues).map(([k, n]) => `${esc(k)}${n}`).join("・")}</div>`;
    $("mclose").onclick = closeModal;
    $("sheet").querySelectorAll("[data-c]").forEach((b) => b.addEventListener("click", () => draw(Number(b.dataset.c))));
    $("sg").querySelectorAll("button").forEach((b) => b.onclick = () => { state.g = b.dataset.p; draw(c); });
  };
  draw(Number(course) || 1);
}
function closeModal() { $("modal").hidden = true; }
$("modal").addEventListener("click", (ev) => { if (ev.target.id === "modal") closeModal(); });
$("view-race").addEventListener("click", (ev) => {
  const n = ev.target.closest(".nm");
  if (n && n.dataset.reg) openRacer(n.dataset.reg, n.dataset.course);
});

init();
</script>
